<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>דיווח שטח | מערכת הקמפוס</title><style>:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee7;--primary:#4f46e5;--ok:#027a48;--bad:#b42318;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 100px}.top{position:sticky;top:0;background:#f4f6faf7;backdrop-filter:blur(12px);padding-bottom:10px;z-index:5}.brand{font-size:21px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.search{width:100%;padding:13px;border:1px solid #cbd3df;border-radius:12px;font-size:16px}.group{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:12px;background:#f8fafc;font-weight:900}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}.room{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;text-align:right;font-weight:900;min-height:60px}.room small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.checked{background:#f5fff9;border-color:#a8d9bb}.gap{background:#fff8f7;border-color:#efb4af}.damage{box-shadow:inset 4px 0 #b42318}.hidden{display:none}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.roomtitle{font-size:29px;font-weight:950}.muted{color:var(--muted);font-size:12px}.item{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.numbers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.num{background:#f8fafc;border-radius:10px;text-align:center;padding:8px}.num small{display:block;color:var(--muted);font-size:10px}.num strong{font-size:20px}.field{margin-top:11px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:11px;font-size:16px;background:#fff}.field textarea{min-height:85px}.actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px}.actionsin{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 7px;font-weight:900}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.success{color:var(--ok)}.error{color:var(--bad)}@media(min-width:650px){.rooms{grid-template-columns:repeat(4,1fr)}} </style></head><body><div class="app"><div id="picker"><header class="top"><div class="brand">📋 דיווח שטח</div><div class="sub">בחר את החדר שבו אתה נמצא. לאחר הבדיקה השמירה מתבצעת ישירות במערכת.</div></header><div class="card"><input id="search" class="search" placeholder="חיפוש חדר..." oninput="renderPicker()"><div id="groups"></div></div></div><div id="report" class="hidden"><button class="back" onclick="showPicker()">← חזרה לבחירת חדר</button><div class="card"><div class="roomtitle" id="title"></div><div class="muted" id="meta"></div></div><div class="card"><h3>📦 מצאי בחדר</h3><div class="muted">מלא רק את מה שקיים בפועל. הפער מחושב אוטומטית.</div><div id="inventory"></div></div><div class="card"><h3>🛠️ בקרת נזקים</h3><div class="field"><label>האם נמצא נזק?</label><select id="hasDamage" onchange="toggleDamage()"><option value="no">לא</option><option value="yes">כן</option></select></div><div id="damageForm" class="hidden"><div class="field"><label>קטגוריה</label><select id="category"><option value="FURNITURE">ריהוט</option><option value="ELECTRICAL">חשמל</option><option value="PLUMBING">אינסטלציה</option><option value="STRUCTURE">מבנה</option><option value="CLEANLINESS">ניקיון</option><option value="HVAC">מיזוג</option><option value="OTHER">אחר</option></select></div><div class="field"><label>חומרה</label><select id="severity"><option value="LOW">נמוכה</option><option value="MEDIUM">בינונית</option><option value="HIGH">גבוהה</option><option value="CRITICAL">קריטית</option></select></div><div class="field"><label>תיאור הנזק</label><textarea id="description" placeholder="מה נפגע ומה מצב הפריט?"></textarea></div></div><div id="message"></div></div></div></div><div id="actions" class="actions hidden"><div class="actionsin"><button class="btn" onclick="previousRoom()">← קודם</button><button class="btn primary" onclick="save()">💾 שמור חדר</button><button class="btn" onclick="nextRoom()">הבא →</button></div></div><script>const fields={beds:['מיטות','beds_req'],mattresses:['מזרנים','mattresses_req'],closets:['ארונות','closets_req'],ac_units:['מזגנים','ac_units_req'],ac_remotes:['שלטים','ac_remotes_req']};let rooms=[],current=-1;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const n=v=>Math.max(0,Number(v)||0);function roomNo(s){const m=String(s).match(/(\d{3})$/);return m?+m[1]:null}function group(s){const x=roomNo(s);if(x>=101&&x<=108)return['קומה 1','🏢'];if(x>=201&&x<=212)return['קומה 2','🏢'];if(x>=301&&x<=313)return['קומה 3','🏢'];if(/^קרוון(?:\s|$)/.test(s))return['מתחם קרוואנים','🏕️'];return['יחידות נוספות','📦']}async function load(){const r=await fetch('/analyze?mode=std');if(!r.ok)throw Error('לא ניתן לטעון את החדרים');rooms=await r.json();rooms.sort((a,b)=>(roomNo(a.apartment)||9999)-(roomNo(b.apartment)||9999));renderPicker()}function renderPicker(){const q=document.getElementById('search').value.trim().toLowerCase();const groups={};rooms.filter(r=>!q||String(r.apartment).toLowerCase().includes(q)).forEach(r=>{const g=group(r.apartment)[0];(groups[g]??=[]).push(r)});document.getElementById('groups').innerHTML=Object.entries(groups).map(([g,list])=>`<div class="group"><div class="head">${group(list[0].apartment)[1]} ${g}</div><div class="rooms">${list.map(r=>{const gap=Object.keys(fields).some(k=>n(r[k+'_act'])!==n(r[k+'_req']));return `<button class="room ${r.inventory_checked?'checked':''} ${gap?'gap':''}" onclick="openRoom('${esc(r.apartment)}')">${esc(r.apartment)}<small>${r.inventory_checked?(gap?'🟠 יש פער':'🟢 נבדק ותקין'):'⚪ טרם נבדק'}</small></button>`}).join('')}</div></div>`).join('')||'<div class="muted" style="padding:20px;text-align:center">לא נמצא חדר</div>'}function openRoom(name){current=rooms.findIndex(r=>r.apartment===name);if(current<0)return;const r=rooms[current];document.getElementById('picker').classList.add('hidden');document.getElementById('report').classList.remove('hidden');document.getElementById('actions').classList.remove('hidden');document.getElementById('title').textContent=r.apartment;document.getElementById('meta').textContent='בדיקה פיזית • מה קיים בפועל';document.getElementById('inventory').innerHTML=Object.entries(fields).map(([k,v])=>`<div class="item"><b>${v[0]}</b><div class="numbers"><div class="num"><small>צריך להיות</small><strong>${n(r[k+'_req'])}</strong></div><div class="num"><small>קיים בפועל</small><input style="width:100%;border:0;background:transparent;text-align:center;font-size:20px;font-weight:900" type="number" min="0" id="${k}" value="${n(r[k+'_act'])}" oninput="updateGap('${k}')"></div><div class="num"><small>פער</small><strong id="gap_${k}">${n(r[k+'_act'])-n(r[k+'_req'])}</strong></div></div></div>`).join('');document.getElementById('hasDamage').value='no';toggleDamage();document.getElementById('message').textContent=''}function updateGap(k){const r=rooms[current];document.getElementById('gap_'+k).textContent=n(document.getElementById(k).value)-n(r[k+'_req'])}function toggleDamage(){document.getElementById('damageForm').classList.toggle('hidden',document.getElementById('hasDamage').value!=='yes')}function showPicker(){document.getElementById('report').classList.add('hidden');document.getElementById('actions').classList.add('hidden');document.getElementById('picker').classList.remove('hidden');renderPicker()}async function save(){const r=rooms[current];const values={apartment:r.apartment};Object.keys(fields).forEach(k=>values[k]=n(document.getElementById(k).value));const msg=document.getElementById('message');msg.className='';msg.textContent='שומר...';try{const a=await fetch('/update_actual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});if(!a.ok)throw Error((await a.json()).detail||'השמירה נכשלה');if(document.getElementById('hasDamage').value==='yes'){const d=await fetch('/damages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apartment:r.apartment,category:document.getElementById('category').value,severity:document.getElementById('severity').value,description:document.getElementById('description').value})});if(!d.ok)throw Error((await d.json()).detail||'שמירת הנזק נכשלה')}Object.keys(fields).forEach(k=>r[k+'_act']=values[k]);r.inventory_checked=true;msg.className='success';msg.textContent='✅ החדר נשמר בהצלחה';setTimeout(()=>showPicker(),500)}catch(e){msg.className='error';msg.textContent='❌ '+e.message}}function nextRoom(){if(current<rooms.length-1)openRoom(rooms[current+1].apartment)}function previousRoom(){if(current>0)openRoom(rooms[current-1].apartment)}load().catch(e=>document.getElementById('groups').innerHTML='<div class="error" style="padding:20px">❌ '+esc(e.message)+'</div>');</script></body></html>
