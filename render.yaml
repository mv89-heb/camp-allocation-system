services:
  - type: web
    name: camp-allocation-system
    runtime: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false
