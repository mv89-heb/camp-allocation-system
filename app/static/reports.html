<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דוחות | מערכת הקמפוס</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee7;--primary:#4f46e5;--bad:#b42318;--warn:#b54708;--ok:#027a48;--soft:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px 14px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:26px;font-weight:950}.sub{font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:10px 13px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.filters{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:10px;background:#fff;font:inherit}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.floor{margin-top:18px}.floor-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px;font-weight:950}.floor-title small{font-size:12px;color:var(--muted);font-weight:700}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.room{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:right}.room:hover{border-color:#9aa4b2}.room-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.room-name{font-size:20px;font-weight:950}.badge{font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px}.b-ok{background:#ecfdf3;color:var(--ok)}.b-bad{background:#fff1f0;color:var(--bad)}.b-warn{background:#fff8e8;color:var(--warn)}.b-none{background:#f2f4f7;color:var(--muted)}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.num{background:var(--soft);border-radius:9px;padding:7px;text-align:center}.num small{display:block;color:var(--muted);font-size:10px}.num strong{font-size:17px}.gap-bad{color:var(--bad)}.gap-ok{color:var(--ok)}.gap-warn{color:var(--warn)}.damage{margin-top:8px;color:var(--bad);font-size:12px;font-weight:850}.checked{margin-top:8px;color:var(--muted);font-size:11px}.empty{text-align:center;color:var(--muted);padding:25px}.error{color:var(--bad);font-weight:850}@media(max-width:750px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.rooms{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.top{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.summary{grid-template-columns:1fr 1fr}.rooms{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div><div class="title">📊 דוחות מצב</div><div class="sub">מסתכלים על הנתונים עצמם: מה צריך להיות, מה קיים בפועל, ומה הפער.</div></div>
 <div class="actions"><a class="btn" href="/static/field.html">📱 דיווח שטח</a><a class="btn" href="/static/admin.html">⚙️ ניהול</a><button class="btn primary" onclick="load()">🔄 רענן</button></div>
</header>
<section class="card"><div class="filters"><select id="mode" onchange="load()"><option value="std">נתוני תקן</option><option value="plan">נתוני תכנון</option></select><select id="filter" onchange="render()"><option value="all">כל החדרים</option><option value="unchecked">טרם נבדקו</option><option value="shortage">יש חוסר</option><option value="surplus">יש עודף</option><option value="balanced">ללא פער</option></select><input id="q" placeholder="🔎 חיפוש חדר, למשל 101" oninput="render()"></div></section>
<section class="card"><div id="summary" class="summary"></div></section>
<section id="content"></section>
</div>
<script>
let rows=[];
const items=[['beds','מיטות'],['mattresses','מזרנים'],['closets','ארונות'],['ac_units','מזגנים'],['ac_remotes','שלטים']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const gap=(r,k)=>Number(r[k+'_act']??0)-Number(r[k+'_req']??0);
function roomNo(s){const m=String(s).match(/(\d{3})$/);return m?Number(m[1]):9999}
function group(s){const n=roomNo(s),t=String(s);if(n>=101&&n<=108)return['1','🏢 קומה 1','101–108'];if(n>=201&&n<=212)return['2','🏢 קומה 2','201–212'];if(n>=301&&n<=313)return['3','🏢 קומה 3','301–313'];if(/^קרוון(?:\s|$)/.test(t))return['4','🏕️ מתחם קרוואנים','כל הקרוואנים'];return['5','📦 יחידות נוספות','יתר היחידות']}
function roomState(r){if(!r.inventory_checked)return['b-none','⚪ טרם נבדק'];const gs=items.map(x=>gap(r,x[0]));if(gs.some(x=>x<0))return['b-bad','🔴 יש חוסר'];if(gs.some(x=>x>0))return['b-warn','🟠 יש עודף'];return['b-ok','🟢 תקין']}
function renderRoom(r){const [bc,bt]=roomState(r);return `<article class="room"><div class="room-head"><div class="room-name">${esc(r.apartment)}</div><span class="badge ${bc}">${bt}</span></div><div class="numbers">${items.map(([k,label])=>{const req=Number(r[k+'_req']??0),act=Number(r[k+'_act']??0),g=act-req;return `<div class="num"><small>${label}</small><strong>${req} / ${act}</strong><small class="${g<0?'gap-bad':g>0?'gap-warn':'gap-ok'}">פער ${g>0?'+':''}${g}</small></div>`}).join('')}</div>${r.open_damage?'<div class="damage">🛠️ יש נזק פתוח</div>':''}${r.inventory_checked?`<div class="checked">נבדק: ${new Date(r.checked_at).toLocaleString('he-IL')}</div>`:''}</article>`}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),f=document.getElementById('filter').value;const list=rows.filter(r=>!q||String(r.apartment).toLowerCase().includes(q)).filter(r=>{const gs=items.map(x=>gap(r,x[0]));if(f==='unchecked')return!r.inventory_checked;if(f==='shortage')return r.inventory_checked&&gs.some(x=>x<0);if(f==='surplus')return r.inventory_checked&&gs.some(x=>x>0);if(f==='balanced')return r.inventory_checked&&gs.every(x=>x===0);return true});const done=rows.filter(r=>r.inventory_checked).length,short=rows.filter(r=>r.inventory_checked&&items.some(x=>gap(r,x[0])<0)).length,sur=rows.filter(r=>r.inventory_checked&&items.some(x=>gap(r,x[0])>0)).length;document.getElementById('summary').innerHTML=[['סה״כ חדרים',rows.length],['נבדקו',done],['יש חוסר',short],['יש עודף',sur]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');const map={};list.forEach(r=>{const g=group(r.apartment);(map[g[0]]??={meta:g,list:[]}).list.push(r)});let html='';Object.keys(map).sort().forEach(k=>{const x=map[k];x.list.sort((a,b)=>roomNo(a.apartment)-roomNo(b.apartment));html+=`<section class="floor"><div class="floor-title"><span>${x.meta[1]}</span><small>${x.meta[2]} · ${x.list.length} חדרים</small></div><div class="rooms">${x.list.map(renderRoom).join('')}</div></section>`});document.getElementById('content').innerHTML=html||'<div class="card empty">אין נתונים להצגה</div>'}
async function load(){try{const r=await fetch('/analyze?mode='+document.getElementById('mode').value);const d=await r.json();if(!r.ok)throw Error(d.detail||('HTTP '+r.status));rows=d;render()}catch(e){document.getElementById('content').innerHTML=`<div class="card error">❌ ${esc(e.message)}</div>`}}
load();
</script>
</body>
</html>
