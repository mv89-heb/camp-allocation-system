<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>דוחות | מערכת הקמפוס</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe4ea;--primary:#4f46e5;--bad:#b42318;--badbg:#fff1f0;--ok:#027a48;--okbg:#ecfdf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.title{font-size:25px;font-weight:900}.sub{font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800;text-decoration:none;color:var(--text)}.primary{background:var(--primary);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:right}.table th{background:#f8fafc}.bad{color:var(--bad);font-weight:900}.ok{color:var(--ok);font-weight:900}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{padding:10px;border:1px solid #cbd3df;border-radius:10px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:600px){.top{flex-direction:column}.actions .btn{flex:1}.summary{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><header class="top"><div><div class="title">📈 דוחות תפעוליים</div><div class="sub">מה קיים בפועל, מה צריך להיות, ואיפה יש פער</div></div><div class="actions"><a class="btn" href="/static/admin.html">📊 ניהול</a><button class="btn primary" onclick="load()">🔄 רענן</button></div></header><section class="card"><div class="filters"><select id="mode" onchange="load()"><option value="std">תקן סטנדרטי</option><option value="plan">תקן מתוכנן</option></select><input id="q" placeholder="חיפוש חדר" oninput="render()"><select id="filter" onchange="render()"><option value="all">הכול</option><option value="unchecked">טרם נבדק</option><option value="shortage">חוסרים</option><option value="surplus">עודפים</option><option value="balanced">ללא פער</option></select></div></section><section class="card"><div id="summary" class="summary"></div></section><section class="card"><div class="table"><table><thead><tr><th>חדר</th><th>מיטות<br>צריך / בפועל / פער</th><th>מזרנים<br>צריך / בפועל / פער</th><th>ארונות<br>צריך / בפועל / פער</th><th>מזגנים<br>צריך / בפועל / פער</th><th>שלטים<br>צריך / בפועל / פער</th><th>סטטוס</th></tr></thead><tbody id="body"></tbody></table></div></section></div><script>let rows=[];const items=[['beds','מיטות'],['mattresses','מזרנים'],['closets','ארונות'],['ac_units','מזגנים'],['ac_remotes','שלטים']];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(p){const r=await fetch(p);let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function gap(r,k){return Number(r[k+'_act']??0)-Number(r[k+'_req']??0)}function state(r){if(!r.inventory_checked)return'⚪ טרם נבדק';const gs=items.map(x=>gap(r,x[0]));if(gs.some(x=>x<0))return'🔴 יש חוסר';if(gs.some(x=>x>0))return'🟠 יש עודף';return'🟢 תקין'}function render(){const q=document.getElementById('q').value.toLowerCase().trim(),f=document.getElementById('filter').value;let list=rows.filter(r=>!q||String(r.apartment).toLowerCase().includes(q)).filter(r=>{const gs=items.map(x=>gap(r,x[0]));if(f==='unchecked')return!r.inventory_checked;if(f==='shortage')return r.inventory_checked&&gs.some(x=>x<0);if(f==='surplus')return r.inventory_checked&&gs.some(x=>x>0);if(f==='balanced')return r.inventory_checked&&gs.every(x=>x===0);return true});const done=rows.filter(r=>r.inventory_checked).length,short=rows.filter(r=>r.inventory_checked&&items.some(x=>gap(r,x[0])<0)).length,sur=rows.filter(r=>r.inventory_checked&&items.some(x=>gap(r,x[0])>0)).length;document.getElementById('summary').innerHTML=[['סה״כ',rows.length],['נבדקו',done],['חדרים עם חוסר',short],['חדרים עם עודף',sur]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');document.getElementById('body').innerHTML=list.map(r=>`<tr><td><b>${esc(r.apartment)}</b></td>${items.map(x=>{const g=gap(r,x[0]),req=Number(r[x[0]+'_req']??0),act=Number(r[x[0]+'_act']??0);return`<td>${req} / ${act} / <span class="${g<0?'bad':g>0?'':'ok'}">${g>0?'+':''}${g}</span></td>`}).join('')}<td>${state(r)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">אין נתונים להצגה</td></tr>'}async function load(){try{rows=await api('/analyze?mode='+document.getElementById('mode').value);render()}catch(e){document.getElementById('body').innerHTML='<tr><td colspan="7" class="empty">שגיאה: '+esc(e.message)+'</td></tr>'}}load();</script></body></html>
