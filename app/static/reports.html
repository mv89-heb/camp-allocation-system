<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דוחות | מערכת הקמפוס</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee7;--primary:#4f46e5;--bad:#b42318;--warn:#b54708;--ok:#027a48;--soft:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:14px 14px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:26px;font-weight:950}.sub{font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:10px 13px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.notice{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;font-weight:800}.filters{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:10px;background:#fff;font:inherit}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.unit{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.unit-head{padding:12px 14px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:10px}.unit-name{font-size:18px;font-weight:950}.unit-meta{font-size:12px;color:var(--muted);margin-top:3px}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;white-space:nowrap}.b-ok{background:#ecfdf3;color:var(--ok)}.b-bad{background:#fff1f0;color:var(--bad)}.b-warn{background:#fff8e8;color:var(--warn)}.b-partial{background:#fff7ed;color:#9a3412}.b-none{background:#f2f4f7;color:var(--muted)}.unit-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}.metric{background:var(--soft);border-radius:9px;padding:7px;text-align:center}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{font-size:16px}.gap-bad{color:var(--bad)}.gap-ok{color:var(--ok)}.gap-warn{color:var(--warn)}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 14px}.room{border:1px solid var(--line);border-radius:12px;padding:10px}.room-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.room-name{font-size:18px;font-weight:950}.room-sub{font-size:11px;color:var(--muted);margin-top:3px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.num{background:var(--soft);border-radius:8px;padding:6px;text-align:center}.num small{display:block;color:var(--muted);font-size:9px}.num strong{font-size:15px}.checked{margin-top:7px;color:var(--muted);font-size:10px}.empty{text-align:center;color:var(--muted);padding:25px}.error{color:var(--bad);font-weight:850}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.summary{grid-template-columns:repeat(3,1fr)}.unit-summary{grid-template-columns:repeat(3,1fr)}.rooms{grid-template-columns:1fr}.numbers{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.top{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.summary{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.unit-head{align-items:flex-start;flex-direction:column}.unit-summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div><div class="title">📊 דוחות מצב</div><div class="sub">הדיווח נשאר לפי חדר. התקן והפער מחושבים לפי יחידת התקן, למשל 101–102 כמכלול.</div></div>
 <div class="actions"><a class="btn" href="/static/field.html">📱 דיווח שטח</a><a class="btn" href="/static/admin.html">⚙️ ניהול</a><button class="btn primary" onclick="load()">🔄 רענן</button></div>
</header>
<section class="card notice">ℹ️ חדרים מחוברים אינם מקבלים תקן כפול. לדוגמה, התקן של 101–102 מחושב פעם אחת על שני החדרים יחד, בעוד שהמצאי של 101 והמצאי של 102 נשמרים ומדווחים בנפרד.</section>
<section class="card"><div class="filters"><select id="mode" onchange="load()"><option value="std">נתוני תקן</option><option value="plan">נתוני תכנון</option></select><select id="filter" onchange="render()"><option value="all">כל יחידות התקן</option><option value="unchecked">טרם נבדקו</option><option value="partial">נבדקו חלקית</option><option value="shortage">יש חוסר</option><option value="surplus">יש עודף</option><option value="balanced">תקין</option></select><input id="q" placeholder="🔎 חיפוש חדר או יחידת תקן, למשל 101" oninput="render()"></div></section>
<section class="card"><div id="summary" class="summary"></div></section>
<section id="content"></section>
</div>
<script>
let rows=[];
const items=[['beds','מיטות'],['mattresses','מזרנים'],['closets','ארונות'],['ac_units','מזגנים'],['ac_remotes','שלטים']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function roomNo(s){const m=String(s).match(/(\d{3})$/);return m?Number(m[1]):9999}
function unitRows(){const map=new Map();rows.forEach(r=>{const key=r.standard_unit_id||r.apartment;if(!map.has(key))map.set(key,[]);map.get(key).push(r)});return [...map.values()]}
function unitState(rs){const r=rs[0],s=r.unit_status||'הצמד טרם נבדק';if(s==='תקין בצמד')return['b-ok','🟢 תקין'];if(s==='חסר בצמד')return['b-bad','🔴 יש חוסר'];if(s==='עודף בצמד')return['b-warn','🟠 יש עודף'];if(s==='הצמד נבדק חלקית')return['b-partial','🟠 נבדק חלקית'];return['b-none','⚪ טרם נבדק']}
function renderUnit(rs){rs.sort((a,b)=>roomNo(a.apartment)-roomNo(b.apartment));const r=rs[0],[bc,bt]=unitState(rs);const metrics=items.map(([k,label])=>{const req=Number(r['unit_'+k+'_req']??0),act=Number(r['unit_'+k+'_act']??0),g=Number(r['unit_gap_'+k]??0);return `<div class="metric"><small>${label}</small><strong>${req} / ${act}</strong><small class="${g<0?'gap-bad':g>0?'gap-warn':'gap-ok'}">פער ${g>0?'+':''}${g}</small></div>`}).join('');const rooms=rs.map(x=>`<article class="room"><div class="room-head"><div><div class="room-name">${esc(x.apartment)}</div><div class="room-sub">מצאי פיזי של חדר זה בלבד · ${esc(x.room_status||'לא נבדק')}</div></div>${x.inventory_checked?'<span class="badge b-ok">✓ נבדק</span>':'<span class="badge b-none">טרם נבדק</span>'}</div><div class="numbers">${items.map(([k,label])=>{const act=Number(x[k+'_act']??0);return `<div class="num"><small>${label}</small><strong>${act}</strong></div>`}).join('')}</div>${x.inventory_checked?`<div class="checked">נבדק: ${new Date(x.checked_at).toLocaleString('he-IL')}</div>`:''}</article>`).join('');return `<section class="unit"><div class="unit-head"><div><div class="unit-name">${esc(r.standard_unit_label||r.standard_unit_id||r.apartment)}</div><div class="unit-meta">${rs.length} חדרים · התקן נבדק לפי היחידה כולה</div></div><span class="badge ${bc}">${bt}</span></div><div class="unit-summary">${metrics}</div><div class="rooms">${rooms}</div></section>`}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),f=document.getElementById('filter').value;let units=unitRows().filter(rs=>!q||rs.some(r=>String(r.apartment).toLowerCase().includes(q)||String(r.standard_unit_id).toLowerCase().includes(q)||String(r.standard_unit_label).toLowerCase().includes(q))).filter(rs=>{const s=rs[0].unit_status||'';if(f==='unchecked')return s==='הצמד טרם נבדק';if(f==='partial')return s==='הצמד נבדק חלקית';if(f==='shortage')return s==='חסר בצמד';if(f==='surplus')return s==='עודף בצמד';if(f==='balanced')return s==='תקין בצמד';return true});const all=unitRows();const done=all.filter(x=>x[0].unit_inventory_complete).length,partial=all.filter(x=>x[0].unit_inventory_partial).length,short=all.filter(x=>x[0].unit_status==='חסר בצמד').length,sur=all.filter(x=>x[0].unit_status==='עודף בצמד').length;document.getElementById('summary').innerHTML=[['יחידות תקן',all.length],['נבדקו במלואן',done],['נבדקו חלקית',partial],['יש חוסר',short],['יש עודף',sur]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');units.sort((a,b)=>String(a[0].standard_unit_id).localeCompare(String(b[0].standard_unit_id),'he',{numeric:true}));document.getElementById('content').innerHTML=units.map(renderUnit).join('')||'<div class="card empty">אין נתונים להצגה</div>'}
async function load(){try{const r=await fetch('/analyze?mode='+document.getElementById('mode').value);const d=await r.json();if(!r.ok)throw Error(d.detail||('HTTP '+r.status));rows=d;render()}catch(e){document.getElementById('content').innerHTML=`<div class="card error">❌ ${esc(e.message)}</div>`}}
load();
</script>
</body>
</html>
