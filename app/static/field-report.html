<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="/static/manifest.json"><title>דיווח שטח | מערכת הקמפוס</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee7;--p:#4f46e5;--ok:#027a48;--bad:#b42318;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:12px 12px 115px}.top{position:sticky;top:0;z-index:5;background:#f4f6faf2;backdrop-filter:blur(10px);padding-bottom:9px}.brand{font-size:24px;font-weight:950}.sub,.muted{color:var(--muted);font-size:12px}.search,.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:11px;background:#fff}.search{margin-top:9px;font-size:16px}.card,.group{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-top:11px}.card{padding:13px}.group{overflow:hidden}.group h3{margin:0;padding:11px;background:#f8fafc;font-size:15px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}.room{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;text-align:right;font-weight:900;min-height:66px;cursor:pointer}.room small{display:block;color:var(--muted);margin-top:4px;font-weight:700}.checked{background:#f5fff9;border-color:#b6ddc5}.gap{background:#fff8f7;border-color:#efbbb6}.title{font-size:27px;font-weight:950;margin-top:10px}.back,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff;border-color:var(--p)}.wa{background:#0a8f4d;color:#fff;border-color:#0a8f4d}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field textarea{min-height:80px;resize:vertical}.inventory-row,.damage-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.box{background:#f8fafc;border-radius:9px;text-align:center;padding:7px}.box small{display:block;color:var(--muted);font-size:10px}.box strong{font-size:19px}.box input{width:100%;border:0;background:transparent;text-align:center;font-size:20px;font-weight:900;outline:none}.gap-ok{color:var(--ok)}.gap-bad{color:var(--bad)}.gap-warn{color:var(--warn)}.damage-row{border-color:#efc3be;background:#fffdfd}.damage-head{display:flex;justify-content:space-between;align-items:center}.remove{border:0;background:#fff0ef;color:var(--bad);border-radius:8px;padding:6px 9px;cursor:pointer}.msg{margin-top:9px;font-weight:850}.ok{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}.statusbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:7px;text-align:center;font-size:12px;font-weight:850}.offline{color:var(--warn)}.online{color:var(--ok)}.queue{margin-top:8px;padding:9px;background:#fff8e8;border:1px solid #f1d49b;border-radius:10px;font-size:12px}.section-title{font-size:17px;font-weight:950}.section-sub{margin-top:3px;color:var(--muted);font-size:12px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{padding:6px 9px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:850}.pill.bad{background:#fff0ef;color:var(--bad)}.actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;z-index:10}.actions-in{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:7px}.hidden{display:none!important}@media(min-width:650px){.rooms{grid-template-columns:repeat(4,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.rooms{grid-template-columns:1fr}.actions-in{grid-template-columns:1fr 1.5fr 1fr}}
</style></head>
<body>
<div id="statusbar" class="statusbar offline">בודק חיבור...</div>
<div class="app">
<section id="picker"><header class="top"><div class="brand">📱 דיווח שטח</div><div class="sub">בחר חדר אחד מהרשימה. בדוק, דווח ושמור.</div><input id="search" class="search" placeholder="🔎 חיפוש חדר..." oninput="renderPicker()"></header><div id="queue" class="queue hidden"></div><div id="groups"></div></section>
<section id="report" class="hidden"><button class="back" onclick="showPicker()">← בחירת חדר אחר</button><div class="title" id="roomTitle"></div><div class="muted">בדיקה פיזית · המצאי והנזקים נשמרים יחד</div>
<div class="card"><div class="section-title">👤 פרטי דיווח</div><div class="field"><label>שם המדווח</label><input id="reporter" maxlength="120" placeholder="השם שיופיע בדיווח"></div><div class="field"><label>מספר WhatsApp של מנהל/מוקד</label><input id="waPhone" inputmode="tel" maxlength="20" placeholder="9725XXXXXXXX"><div class="muted">מספר בינלאומי, ספרות בלבד. נשמר במכשיר הזה בלבד.</div></div></div>
<div class="card"><div class="section-title">📦 מצאי בחדר</div><div class="section-sub">הזן רק את מה שקיים בפועל. הפער מחושב אוטומטית.</div><div id="inventory"></div></div>
<div class="card"><div class="section-title">🛠️ בקרת נזקים</div><div class="section-sub">דווח על כל נזק שמצאת בחדר.</div><div class="field"><label>האם יש נזק?</label><select id="hasDamage" onchange="toggleDamage()"><option value="no">לא</option><option value="yes">כן</option></select></div><div id="damageArea" class="hidden"><div id="damageSummary" class="pills"></div><div id="damages"></div><button class="btn" style="width:100%;margin-top:8px" onclick="addDamage()">＋ הוסף נזק נוסף</button></div></div>
<div id="msg" class="msg"></div><div id="saveState" class="muted" style="margin-top:8px"></div></section></div>
<div id="actions" class="actions hidden"><div class="actions-in"><button class="btn" onclick="move(-1)">← קודם</button><button class="btn primary" onclick="saveRoom()">💾 שמור חדר</button><button class="btn" onclick="move(1)">הבא →</button></div></div>
<script>
const QUEUE_KEY='camp_field_queue',WA_KEY='camp_whatsapp_phone',REPORTER_KEY='camp_reporter';let rooms=[],current=-1,damageDrafts=[];
const fields={beds:['מיטות','beds_req'],mattresses:['מזרנים','mattresses_req'],closets:['ארונות','closets_req'],ac_units:['מזגנים','ac_units_req'],ac_remotes:['שלטים','ac_remotes_req']};
const n=v=>Math.max(0,Math.min(1000,Number(v)||0)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch{return[]}}function setQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q));renderQueue()}function renderQueue(){const q=getQueue(),e=document.getElementById('queue');if(!q.length){e.classList.add('hidden');return}e.classList.remove('hidden');e.textContent=`📥 ${q.length} דיווחים ממתינים לסנכרון.`}
function setStatus(){const e=document.getElementById('statusbar'),on=navigator.onLine;e.className='statusbar '+(on?'online':'offline');e.textContent=on?'🟢 מחובר למערכת':'🟠 אין חיבור — הדיווחים יישמרו ויסתנכרנו בהמשך'}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.detail||'שגיאה'),{status:r.status});return d}
function roomNo(s){const m=String(s).match(/(\d{3})$/);return m?Number(m[1]):9999}function group(s){const x=roomNo(s),t=String(s);if(x>=101&&x<=108)return['1','🏢 קומה 1','101–108'];if(x>=201&&x<=212)return['2','🏢 קומה 2','201–212'];if(x>=301&&x<=313)return['3','🏢 קומה 3','301–313'];if(/^קרוון(?:\s|$)/.test(t))return['4','🏕️ מתחם קרוואנים','כל הקרוואנים'];return['5','📦 יחידות נוספות','יתר היחידות']}
function hasGap(r){return Object.keys(fields).some(k=>n(r[k+'_act'])!==n(r[k+'_req']))}
function renderPicker(){const q=(document.getElementById('search')?.value||'').trim().toLowerCase(),map={};rooms.filter(r=>!q||String(r.apartment).toLowerCase().includes(q)).forEach(r=>{const g=group(r.apartment);(map[g[0]]??={meta:g,list:[]}).list.push(r)});let h='';Object.keys(map).sort().forEach(k=>{const x=map[k];x.list.sort((a,b)=>roomNo(a.apartment)-roomNo(b.apartment));h+=`<div class="group"><h3>${x.meta[1]} <span class="muted">${x.meta[2]}</span></h3><div class="rooms">${x.list.map(r=>`<button class="room ${r.inventory_checked?'checked':''} ${hasGap(r)?'gap':''}" onclick="openRoom('${encodeURIComponent(r.apartment)}')">${esc(r.apartment)}<small>${r.open_damage?'🛠️ נזק פתוח · ':''}${r.inventory_checked?(hasGap(r)?'🟠 נבדק ויש פער':'🟢 נבדק'):'⚪ טרם נבדק'}</small></button>`).join('')}</div></div>`});document.getElementById('groups').innerHTML=h||'<div class="card muted">לא נמצא חדר.</div>';renderQueue()}
function openRoom(encoded){current=rooms.findIndex(r=>r.apartment===decodeURIComponent(encoded));if(current<0)return;const r=rooms[current];document.getElementById('picker').classList.add('hidden');document.getElementById('report').classList.remove('hidden');document.getElementById('actions').classList.remove('hidden');document.getElementById('roomTitle').textContent=r.apartment;document.getElementById('msg').textContent='';document.getElementById('reporter').value=localStorage.getItem(REPORTER_KEY)||'';document.getElementById('waPhone').value=localStorage.getItem(WA_KEY)||'';document.getElementById('saveState').textContent=r.checked_at?`בדיקה אחרונה: ${new Date(r.checked_at).toLocaleString('he-IL')}`:'טרם בוצעה בדיקה';document.getElementById('inventory').innerHTML=Object.entries(fields).map(([k,v])=>{const g=n(r[k+'_act'])-n(r[k+'_req']);return`<div class="inventory-row"><b>${v[0]}</b><div class="grid"><div class="box"><small>צריך להיות</small><strong>${n(r[k+'_req'])}</strong></div><div class="box"><small>קיים בפועל</small><input id="act-${k}" type="number" min="0" max="1000" inputmode="numeric" value="${n(r[k+'_act'])}" oninput="updateGap('${k}')"></div><div class="box"><small>פער</small><strong id="gap-${k}" class="${g<0?'gap-bad':g>0?'gap-warn':'gap-ok'}">${g>0?'+':''}${g}</strong></div></div></div>`}).join('');document.getElementById('hasDamage').value='no';damageDrafts=[];document.getElementById('damageArea').classList.add('hidden');document.getElementById('damages').innerHTML='';renderDamageSummary()}
function updateGap(k){const r=rooms[current],g=n(document.getElementById('act-'+k).value)-n(r[k+'_req']),e=document.getElementById('gap-'+k);e.textContent=(g>0?'+':'')+g;e.className=g<0?'gap-bad':g>0?'gap-warn':'gap-ok'}
function toggleDamage(){const yes=document.getElementById('hasDamage').value==='yes';document.getElementById('damageArea').classList.toggle('hidden',!yes);if(yes&&!damageDrafts.length)addDamage()}
function addDamage(){if(damageDrafts.length<20){damageDrafts.push({category:'FURNITURE',severity:'MEDIUM',description:'',estimated_cost:'',responsible_party:''});renderDamages()}}function removeDamage(i){damageDrafts.splice(i,1);renderDamages()}
function renderDamageSummary(){const e=document.getElementById('damageSummary'),c=damageDrafts.filter(d=>d.severity==='CRITICAL').length,h=damageDrafts.filter(d=>d.severity==='HIGH').length;e.innerHTML=damageDrafts.length?`<span class="pill bad">${damageDrafts.length} נזקים</span>${c?`<span class="pill bad">${c} קריטי</span>`:''}${h?`<span class="pill">${h} גבוה</span>`:''}`:''}
function renderDamages(){document.getElementById('damages').innerHTML=damageDrafts.map((d,i)=>`<div class="damage-row"><div class="damage-head"><b>נזק ${i+1}</b><button class="remove" onclick="removeDamage(${i})">הסר</button></div><div class="field"><label>קטגוריה</label><select onchange="damageDrafts[${i}].category=this.value"><option value="FURNITURE" ${d.category==='FURNITURE'?'selected':''}>ריהוט</option><option value="ELECTRICAL" ${d.category==='ELECTRICAL'?'selected':''}>חשמל</option><option value="PLUMBING" ${d.category==='PLUMBING'?'selected':''}>אינסטלציה</option><option value="STRUCTURE" ${d.category==='STRUCTURE'?'selected':''}>מבנה</option><option value="CLEANLINESS" ${d.category==='CLEANLINESS'?'selected':''}>ניקיון</option><option value="HVAC" ${d.category==='HVAC'?'selected':''}>מיזוג</option><option value="OTHER" ${d.category==='OTHER'?'selected':''}>אחר</option></select></div><div class="field"><label>רמת דחיפות</label><select onchange="damageDrafts[${i}].severity=this.value;renderDamageSummary()"><option value="LOW" ${d.severity==='LOW'?'selected':''}>🟢 רגילה</option><option value="MEDIUM" ${d.severity==='MEDIUM'?'selected':''}>🟡 בינונית</option><option value="HIGH" ${d.severity==='HIGH'?'selected':''}>🟠 דחופה</option><option value="CRITICAL" ${d.severity==='CRITICAL'?'selected':''}>🔴 קריטית</option></select></div><div class="field"><label>תיאור התקלה</label><textarea oninput="damageDrafts[${i}].description=this.value" placeholder="מה קרה ומה צריך לתקן?">${esc(d.description)}</textarea></div><div class="field"><label>עלות משוערת (אופציונלי)</label><input type="number" min="0" step="0.01" value="${esc(d.estimated_cost)}" oninput="damageDrafts[${i}].estimated_cost=this.value"></div><div class="field"><label>גורם אחראי (אופציונלי)</label><input maxlength="160" value="${esc(d.responsible_party)}" oninput="damageDrafts[${i}].responsible_party=this.value"></div></div>`).join('');renderDamageSummary()}
function collectReport(){const r=rooms[current],inventory={apartment:r.apartment};Object.keys(fields).forEach(k=>inventory[k]=n(document.getElementById('act-'+k).value));const damages=damageDrafts.map(d=>({apartment:r.apartment,category:d.category,severity:d.severity,description:d.description.trim(),estimated_cost:d.estimated_cost===''?null:Number(d.estimated_cost),responsible_party:d.responsible_party.trim()||null,resolution_notes:null,evidence_urls:[]}));return{inventory,damages,reporter_name:document.getElementById('reporter').value.trim()}}
function validate(p){if(p.reporter_name.length>120)return'שם המדווח ארוך מדי';for(const d of p.damages){if(d.description.length<5)return'לכל נזק צריך תיאור של לפחות 5 תווים';if(d.estimated_cost!==null&&(!Number.isFinite(d.estimated_cost)||d.estimated_cost<0))return'עלות משוערת אינה תקינה'}return null}
function queueReport(p){const q=getQueue();q.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),payload:p,created_at:new Date().toISOString()});setQueue(q)}
async function syncQueue(){if(!navigator.onLine)return;const q=getQueue();if(!q.length)return;const failed=[];for(const x of q){try{await api('/field-api/room-report',{method:'POST',body:JSON.stringify(x.payload)})}catch{failed.push(x)}}setQueue(failed)}
function cleanPhone(v){return String(v||'').replace(/\D/g,'')}
function buildWhatsAppMessage(p){const r=p.inventory;const lines=['🚨 דיווח תקלה – מערכת הקמפוס','',`📍 חדר: ${r.apartment}`,'',`👤 מדווח: ${p.reporter_name||'—'}`,'',`🕐 זמן: ${new Date().toLocaleString('he-IL')}`,''];p.damages.forEach((d,i)=>{lines.push(`🛠️ תקלה ${i+1}`);lines.push(`⚠️ דחיפות: ${({LOW:'רגילה',MEDIUM:'בינונית',HIGH:'דחופה',CRITICAL:'קריטית'})[d.severity]||d.severity}`);lines.push(`📂 קטגוריה: ${d.category}`);lines.push(`📝 ${d.description}`);if(d.estimated_cost!==null)lines.push(`💰 עלות משוערת: ${d.estimated_cost}`);if(d.responsible_party)lines.push(`👷 אחראי: ${d.responsible_party}`);lines.push('')});lines.push('📦 מצאי שנבדק בחדר:');[['מיטות','beds'],['מזרנים','mattresses'],['ארונות','closets'],['מזגנים','ac_units'],['שלטים','ac_remotes']].forEach(([label,k])=>lines.push(`• ${label}: ${r[k]}`));lines.push('','📋 סטטוס: פתוח');return lines.join('\n')}
function openWhatsApp(p){const phone=cleanPhone(document.getElementById('waPhone').value);if(phone.length<8){document.getElementById('msg').className='msg err';document.getElementById('msg').textContent='❌ יש להזין מספר WhatsApp בינלאומי, למשל 9725XXXXXXXX';document.getElementById('waPhone').focus();return}localStorage.setItem(WA_KEY,phone);localStorage.setItem(REPORTER_KEY,p.reporter_name);const url=`https://wa.me/${phone}?text=${encodeURIComponent(buildWhatsAppMessage(p))}`;window.open(url,'_blank','noopener,noreferrer')}
async function saveRoom(){const p=collectReport(),e=document.getElementById('msg'),v=validate(p);if(v){e.className='msg err';e.textContent='❌ '+v;return}localStorage.setItem(REPORTER_KEY,p.reporter_name);e.className='msg';e.textContent='שומר...';try{if(!navigator.onLine){queueReport(p);e.className='msg warn';e.textContent='🟠 אין חיבור — הדיווח נשמר במכשיר';return}await api('/field-api/room-report',{method:'POST',body:JSON.stringify(p)});const r=rooms[current];Object.keys(fields).forEach(k=>r[k+'_act']=p.inventory[k]);r.inventory_checked=true;r.checked_at=new Date().toISOString();r.open_damage=p.damages.length>0||r.open_damage;e.className='msg ok';e.textContent='✅ הבדיקה נשמרה בהצלחה';document.getElementById('saveState').innerHTML=`<button class="btn wa" onclick='openWhatsApp(${JSON.stringify(p)})'>📱 פתח WhatsApp עם הדיווח</button>`}catch(err){if(!err.status||err.status>=500){queueReport(p);e.className='msg warn';e.textContent='🟠 השרת אינו זמין — הדיווח נשמר במכשיר'}else{e.className='msg err';e.textContent='❌ '+err.message}}}
function showPicker(){document.getElementById('report').classList.add('hidden');document.getElementById('actions').classList.add('hidden');document.getElementById('picker').classList.remove('hidden');renderPicker()}
function move(d){const i=current+d;if(i>=0&&i<rooms.length)openRoom(encodeURIComponent(rooms[i].apartment))}
async function boot(){setStatus();try{rooms=await api('/field-api/rooms');renderPicker();await syncQueue()}catch(e){document.getElementById('groups').innerHTML=`<div class="card"><b>לא ניתן לטעון את החדרים</b><div class="msg err">${esc(e.message)}</div><button class="btn primary" style="margin-top:8px" onclick="boot()">🔄 נסה שוב</button></div>`}}
window.addEventListener('online',async()=>{setStatus();await syncQueue()});window.addEventListener('offline',setStatus);document.addEventListener('DOMContentLoaded',boot);
</script></body></html>
