<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="/static/manifest.json">
<title>דיווח שטח | מערכת הקמפוס</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee7;--p:#4f46e5;--ok:#027a48;--bad:#b42318;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:14px 14px 105px}.top{position:sticky;top:0;z-index:5;background:#f4f6faf2;backdrop-filter:blur(10px);padding-bottom:10px}.brand{font-size:24px;font-weight:950}.sub,.muted{color:var(--muted);font-size:12px}.search{width:100%;padding:13px;border:1px solid #cbd3df;border-radius:12px;font-size:16px;background:#fff;margin-top:10px}.card,.group{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px}.card{padding:14px}.group{overflow:hidden}.group h3{margin:0;padding:12px;background:#f8fafc;font-size:15px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}.room{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:right;font-weight:900;min-height:68px;cursor:pointer}.room small{display:block;color:var(--muted);margin-top:4px;font-weight:700}.checked{background:#f5fff9;border-color:#b6ddc5}.gap{background:#fff8f7;border-color:#efbbb6}.title{font-size:28px;font-weight:950;margin-top:10px}.back,.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff;border-color:var(--p)}.field{margin-top:11px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:10px;background:#fff}.field textarea{min-height:85px;resize:vertical}.inventory-row{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.box{background:#f8fafc;border-radius:10px;text-align:center;padding:8px}.box small{display:block;color:var(--muted);font-size:10px}.box strong{font-size:20px}.box input{width:100%;border:0;background:transparent;text-align:center;font-size:20px;font-weight:900;outline:none}.gap-ok{color:var(--ok)}.gap-bad{color:var(--bad)}.gap-warn{color:var(--warn)}.damage-row{border:1px solid #efc3be;border-radius:12px;padding:12px;margin-top:9px;background:#fffdfd}.damage-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.remove{border:0;background:#fff0ef;color:var(--bad);border-radius:8px;padding:6px 9px;cursor:pointer}.msg{margin-top:10px;font-weight:850}.ok{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}.statusbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:7px 10px;text-align:center;font-size:12px;font-weight:850}.offline{color:var(--warn)}.online{color:var(--ok)}.queue{margin-top:8px;padding:10px;background:#fff8e8;border:1px solid #f1d49b;border-radius:10px;font-size:12px}.section-title{font-size:17px;font-weight:950;margin:0}.section-sub{margin-top:3px;color:var(--muted);font-size:12px}.damage-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{padding:6px 9px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:850}.pill.bad{background:#fff0ef;color:var(--bad)}.actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;z-index:10}.actions-in{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:7px}.save-state{font-size:12px;text-align:center;margin-top:8px;color:var(--muted)}.hidden{display:none!important}@media(min-width:650px){.rooms{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="statusbar" class="statusbar offline">בודק חיבור...</div>
<div class="app">
<section id="picker">
<header class="top"><div class="brand">📱 דיווח שטח</div><div class="sub">בחר חדר אחד מהרשימה. בדוק, דווח ושמור.</div><input id="search" class="search" placeholder="🔎 חיפוש חדר..." oninput="renderPicker()"></header>
<div id="queue" class="queue hidden"></div><div id="groups"></div>
</section>
<section id="report" class="hidden">
<button class="back" onclick="showPicker()">← בחירת חדר אחר</button>
<div class="title" id="roomTitle"></div><div class="muted">בדיקה פיזית · המצאי והנזקים נשמרים יחד</div>
<div class="card"><div class="section-title">📦 מצאי בחדר</div><div class="section-sub">הזן רק את מה שקיים בפועל. הפער מחושב אוטומטית.</div><div id="inventory"></div></div>
<div class="card"><div class="section-title">🛠️ בקרת נזקים</div><div class="section-sub">דווח על כל נזק שמצאת בחדר.</div><div class="field"><label>האם יש נזק?</label><select id="hasDamage" onchange="toggleDamage()"><option value="no">לא</option><option value="yes">כן</option></select></div><div id="damageArea" class="hidden"><div id="damageSummary" class="damage-summary"></div><div id="damages"></div><button class="btn" style="width:100%;margin-top:9px" onclick="addDamage()">＋ הוסף נזק נוסף</button></div></div>
<div id="msg" class="msg"></div><div id="saveState" class="save-state"></div>
</section></div>
<div id="actions" class="actions hidden"><div class="actions-in"><button class="btn" onclick="move(-1)">← קודם</button><button class="btn primary" onclick="saveRoom()">💾 שמור חדר</button><button class="btn" onclick="move(1)">הבא →</button></div></div>
<script>
const QUEUE_KEY='camp_field_queue';let rooms=[],current=-1,damageDrafts=[];
const fields={beds:['מיטות','beds_req'],mattresses:['מזרנים','mattresses_req'],closets:['ארונות','closets_req'],ac_units:['מזגנים','ac_units_req'],ac_remotes:['שלטים','ac_remotes_req']};
const n=v=>Math.max(0,Math.min(1000,Number(v)||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function getQueue(){try{const q=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');return Array.isArray(q)?q:[]}catch{return[]}}
function setQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q));renderQueue()}
function renderQueue(){const q=getQueue(),el=document.getElementById('queue');if(!q.length){el.classList.add('hidden');return}el.classList.remove('hidden');el.textContent=`📥 ${q.length} דיווח${q.length===1?' ממתין':'ים ממתינים'} לסנכרון.`}
function setStatus(){const online=navigator.onLine,el=document.getElementById('statusbar');el.className='statusbar '+(online?'online':'offline');el.textContent=online?'🟢 מחובר למערכת':'🟠 אין חיבור — הדיווחים יישמרו ויסתנכרנו בהמשך'}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.detail||'שגיאה'),{status:r.status});return d}
function roomNo(s){const m=String(s).match(/(\d{3})$/);return m?Number(m[1]):9999}
function group(s){const x=roomNo(s),t=String(s);if(x>=101&&x<=108)return['1','🏢 קומה 1','101–108'];if(x>=201&&x<=212)return['2','🏢 קומה 2','201–212'];if(x>=301&&x<=313)return['3','🏢 קומה 3','301–313'];if(/^קרוון(?:\s|$)/.test(t))return['4','🏕️ מתחם קרוואנים','כל הקרוואנים'];return['5','📦 יחידות נוספות','יתר היחידות']}
function hasGap(r){return Object.keys(fields).some(k=>n(r[k+'_act'])!==n(r[k+'_req']))}
function renderPicker(){const q=(document.getElementById('search')?.value||'').trim().toLowerCase(),map={};rooms.filter(r=>!q||String(r.apartment).toLowerCase().includes(q)).forEach(r=>{const g=group(r.apartment);(map[g[0]]??={meta:g,list:[]}).list.push(r)});let html='';Object.keys(map).sort().forEach(k=>{const x=map[k];x.list.sort((a,b)=>roomNo(a.apartment)-roomNo(b.apartment));html+=`<div class="group"><h3>${x.meta[1]} <span class="muted">${x.meta[2]}</span></h3><div class="rooms">${x.list.map(r=>`<button class="room ${r.inventory_checked?'checked':''} ${hasGap(r)?'gap':''}" onclick="openRoom('${encodeURIComponent(r.apartment)}')">${esc(r.apartment)}<small>${r.open_damage?'🛠️ נזק פתוח · ':''}${r.inventory_checked?(hasGap(r)?'🟠 נבדק ויש פער':'🟢 נבדק'):'⚪ טרם נבדק'}</small></button>`).join('')}</div></div>`});document.getElementById('groups').innerHTML=html||'<div class="card muted">לא נמצא חדר.</div>';renderQueue()}
function openRoom(encoded){current=rooms.findIndex(r=>r.apartment===decodeURIComponent(encoded));if(current<0)return;const r=rooms[current];document.getElementById('picker').classList.add('hidden');document.getElementById('report').classList.remove('hidden');document.getElementById('actions').classList.remove('hidden');document.getElementById('roomTitle').textContent=r.apartment;document.getElementById('msg').textContent='';document.getElementById('saveState').textContent=r.checked_at?`בדיקה אחרונה: ${new Date(r.checked_at).toLocaleString('he-IL')}`:'טרם בוצעה בדיקה';document.getElementById('inventory').innerHTML=Object.entries(fields).map(([k,v])=>{const g=n(r[k+'_act'])-n(r[k+'_req']);return`<div class="inventory-row"><b>${v[0]}</b><div class="grid"><div class="box"><small>צריך להיות</small><strong>${n(r[k+'_req'])}</strong></div><div class="box"><small>קיים בפועל</small><input id="act-${k}" type="number" min="0" max="1000" inputmode="numeric" value="${n(r[k+'_act'])}" oninput="updateGap('${k}')"></div><div class="box"><small>פער</small><strong id="gap-${k}" class="${g<0?'gap-bad':g>0?'gap-warn':'gap-ok'}">${g>0?'+':''}${g}</strong></div></div></div>`}).join('');document.getElementById('hasDamage').value='no';damageDrafts=[];document.getElementById('damageArea').classList.add('hidden');document.getElementById('damages').innerHTML='';renderDamageSummary()}
function updateGap(k){const r=rooms[current],v=n(document.getElementById('act-'+k).value),g=v-n(r[k+'_req']),el=document.getElementById('gap-'+k);el.textContent=(g>0?'+':'')+g;el.className=g<0?'gap-bad':g>0?'gap-warn':'gap-ok'}
function toggleDamage(){const yes=document.getElementById('hasDamage').value==='yes';document.getElementById('damageArea').classList.toggle('hidden',!yes);if(yes&&!damageDrafts.length)addDamage()}
function addDamage(){if(damageDrafts.length>=20)return;damageDrafts.push({category:'FURNITURE',severity:'MEDIUM',description:'',estimated_cost:'',responsible_party:''});renderDamages()}
function removeDamage(i){damageDrafts.splice(i,1);renderDamages()}
function renderDamageSummary(){const el=document.getElementById('damageSummary');if(!el)return;if(!damageDrafts.length){el.innerHTML='';return}const critical=damageDrafts.filter(d=>d.severity==='CRITICAL').length,high=damageDrafts.filter(d=>d.severity==='HIGH').length;el.innerHTML=`<span class="pill bad">${damageDrafts.length} דיווחי נזק</span>${critical?`<span class="pill bad">${critical} קריטי</span>`:''}${high?`<span class="pill">${high} גבוה</span>`:''}`}
function renderDamages(){document.getElementById('damages').innerHTML=damageDrafts.map((d,i)=>`<div class="damage-row"><div class="damage-head"><b>נזק ${i+1}</b><button class="remove" onclick="removeDamage(${i})">הסר</button></div><div class="field"><label>קטגוריה</label><select onchange="damageDrafts[${i}].category=this.value"><option value="FURNITURE" ${d.category==='FURNITURE'?'selected':''}>ריהוט</option><option value="ELECTRICAL" ${d.category==='ELECTRICAL'?'selected':''}>חשמל</option><option value="PLUMBING" ${d.category==='PLUMBING'?'selected':''}>אינסטלציה</option><option value="STRUCTURE" ${d.category==='STRUCTURE'?'selected':''}>מבנה</option><option value="CLEANLINESS" ${d.category==='CLEANLINESS'?'selected':''}>ניקיון</option><option value="HVAC" ${d.category==='HVAC'?'selected':''}>מיזוג</option><option value="OTHER" ${d.category==='OTHER'?'selected':''}>אחר</option></select></div><div class="field"><label>חומרה</label><select onchange="damageDrafts[${i}].severity=this.value;renderDamageSummary()"><option value="LOW" ${d.severity==='LOW'?'selected':''}>נמוכה</option><option value="MEDIUM" ${d.severity==='MEDIUM'?'selected':''}>בינונית</option><option value="HIGH" ${d.severity==='HIGH'?'selected':''}>גבוהה</option><option value="CRITICAL" ${d.severity==='CRITICAL'?'selected':''}>קריטית</option></select></div><div class="field"><label>תיאור הנזק</label><textarea oninput="damageDrafts[${i}].description=this.value" placeholder="מה נפגע ומה צריך לתקן?">${esc(d.description)}</textarea></div><div class="field"><label>עלות משוערת (אופציונלי)</label><input type="number" min="0" step="0.01" inputmode="decimal" value="${esc(d.estimated_cost)}" oninput="damageDrafts[${i}].estimated_cost=this.value"></div><div class="field"><label>גורם אחראי (אופציונלי)</label><input maxlength="160" value="${esc(d.responsible_party)}" oninput="damageDrafts[${i}].responsible_party=this.value" placeholder="למשל: תחזוקה / ספק"></div></div>`).join('');renderDamageSummary()}
function collectReport(){const r=rooms[current],values={apartment:r.apartment};Object.keys(fields).forEach(k=>values[k]=n(document.getElementById('act-'+k).value));const damages=damageDrafts.map(d=>({apartment:r.apartment,category:d.category,severity:d.severity,description:d.description.trim(),estimated_cost:d.estimated_cost===''?null:Number(d.estimated_cost),responsible_party:d.responsible_party.trim()||null,resolution_notes:null,evidence_urls:[]}));return{inventory:values,damages}}
function validateReport(payload){for(const d of payload.damages){if(d.description.length<5)return'לכל נזק צריך תיאור של לפחות 5 תווים';if(d.description.length>5000)return'תיאור הנזק ארוך מדי';if(d.estimated_cost!==null&&(!Number.isFinite(d.estimated_cost)||d.estimated_cost<0))return'עלות משוערת אינה תקינה'}return null}
function queueReport(payload){const q=getQueue();q.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random()),payload,created_at:new Date().toISOString()});setQueue(q)}
async function syncQueue(){if(!navigator.onLine)return;const q=getQueue();if(!q.length)return;const failed=[];for(const item of q){try{await api('/field-api/room-report',{method:'POST',body:JSON.stringify(item.payload)})}catch(e){failed.push(item)}}setQueue(failed);if(!failed.length){try{rooms=await api('/field-api/rooms');renderPicker()}catch{}}}
async function saveRoom(){const r=rooms[current],msg=document.getElementById('msg'),payload=collectReport(),validation=validateReport(payload);if(validation){msg.className='msg err';msg.textContent='❌ '+validation;return}msg.className='msg';msg.textContent='שומר...';document.getElementById('saveState').textContent='';try{if(!navigator.onLine){queueReport(payload);msg.className='msg warn';msg.textContent='🟠 אין חיבור — הדיווח נשמר במכשיר ויסתנכרן אוטומטית';return}await api('/field-api/room-report',{method:'POST',body:JSON.stringify(payload)});Object.keys(fields).forEach(k=>r[k+'_act']=payload.inventory[k]);r.inventory_checked=true;r.checked_at=new Date().toISOString();r.open_damage=payload.damages.length>0||r.open_damage;msg.className='msg ok';msg.textContent='✅ הבדיקה נשמרה בהצלחה';document.getElementById('saveState').textContent='המצאי והנזקים נשמרו יחד בהצלחה';setTimeout(showPicker,650)}catch(e){if(!e.status||e.status>=500){queueReport(payload);msg.className='msg warn';msg.textContent='🟠 המערכת אינה זמינה — הדיווח נשמר במכשיר ויסתנכרן בהמשך'}else{msg.className='msg err';msg.textContent='❌ '+e.message}}}
function showPicker(){document.getElementById('report').classList.add('hidden');document.getElementById('actions').classList.add('hidden');document.getElementById('picker').classList.remove('hidden');renderPicker()}
function move(delta){const ni=current+delta;if(ni>=0&&ni<rooms.length)openRoom(encodeURIComponent(rooms[ni].apartment))}
async function boot(){setStatus();try{rooms=await api('/field-api/rooms');renderPicker();await syncQueue()}catch(e){document.getElementById('groups').innerHTML=`<div class="card"><b>לא ניתן לטעון את החדרים</b><div class="msg err">${esc(e.message)}</div><button class="btn primary" style="margin-top:10px" onclick="boot()">🔄 נסה שוב</button></div>`}}
window.addEventListener('online',async()=>{setStatus();await syncQueue()});window.addEventListener('offline',setStatus);document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
