<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>דיווח חדר | מערכת הקמפוס</title><style>:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee7;--p:#4f46e5;--ok:#027a48;--bad:#b42318;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 105px}.top{position:sticky;top:0;z-index:5;background:#f4f6faf2;backdrop-filter:blur(10px);padding-bottom:10px}.brand{font-size:24px;font-weight:950}.sub{color:var(--muted);font-size:12px;margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.search,input,select,textarea{font:inherit}.search{width:100%;padding:13px;border:1px solid #cbd3df;border-radius:12px;font-size:16px}.group{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}.group h3{margin:0;padding:12px;background:#f8fafc;font-size:15px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:9px}.room{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:right;font-weight:900;min-height:62px}.room small{display:block;color:var(--muted);margin-top:4px}.checked{background:#f5fff9;border-color:#b6ddc5}.gap{background:#fff8f7;border-color:#efbbb6}.hidden{display:none!important}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-weight:850}.title{font-size:28px;font-weight:950;margin-top:10px}.muted{color:var(--muted);font-size:12px}.item{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.box{background:#f8fafc;border-radius:10px;text-align:center;padding:8px}.box small{display:block;color:var(--muted);font-size:10px}.box strong{font-size:20px}.box input{width:100%;border:0;background:transparent;text-align:center;font-size:20px;font-weight:900;outline:none}.field{margin-top:11px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:10px;background:#fff}.field textarea{min-height:80px}.damage-row{border:1px solid #efc3be;border-radius:12px;padding:10px;margin-top:9px}.damage-head{display:flex;justify-content:space-between;align-items:center}.remove{border:0;background:#fff0ef;color:var(--bad);border-radius:8px;padding:6px 9px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:900}.primary{background:var(--p);color:#fff;border-color:var(--p)}.msg{margin-top:10px;font-weight:850}.ok{color:var(--ok)}.err{color:var(--bad)}.actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px;z-index:10}.actions-in{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:7px}@media(min-width:650px){.rooms{grid-template-columns:repeat(4,1fr)}} </style></head><body><div class="app"><div id="login" class="card"><div class="brand">🔐 כניסה לדיווח שטח</div><div class="sub">הזן את קוד המדווח. הוא נשמר במכשיר בלבד כדי שלא תצטרך להזין אותו בכל חדר.</div><div class="field"><label>קוד דיווח</label><input id="token" type="password" autocomplete="off"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="login()">כניסה</button><div id="loginMsg" class="msg"></div></div><section id="picker" class="hidden"><header class="top"><div class="brand">📱 דיווח שטח</div><div class="sub">בחר את החדר שבו אתה נמצא. אין צורך לעבוד לפי הסדר.</div><input id="search" class="search" placeholder="🔎 חיפוש חדר..." oninput="renderPicker()"></header><div id="groups"></div></section><section id="report" class="hidden"><button class="back" onclick="showPicker()">← בחירת חדר אחר</button><div class="title" id="roomTitle"></div><div class="muted">בדיקת מצאי פיזית</div><div class="card"><h3>📦 מה קיים בפועל?</h3><div class="muted">המערכת מציגה כמה צריך להיות. אתה מזין רק את הכמות שמצאת.</div><div id="inventory"></div></div><div class="card"><h3>🛠️ בקרת נזקים</h3><div class="field"><label>האם יש נזק?</label><select id="hasDamage" onchange="toggleDamage()"><option value="no">לא</option><option value="yes">כן</option></select></div><div id="damageArea" class="hidden"><div id="damages"></div><button class="btn" style="width:100%;margin-top:9px" onclick="addDamage()">＋ הוסף נזק נוסף</button></div></div><div id="msg" class="msg"></div></section></div><div id="actions" class="actions hidden"><div class="actions-in"><button class="btn" onclick="move(-1)">← קודם</button><button class="btn primary" onclick="saveRoom()">💾 שמור חדר</button><button class="btn" onclick="move(1)">הבא →</button></div></div><script>let rooms=[],current=-1,damageDrafts=[];const key='camp_field_token';const fields={beds:['מיטות','beds_req'],mattresses:['מזרנים','mattresses_req'],closets:['ארונות','closets_req'],ac_units:['מזגנים','ac_units_req'],ac_remotes:['שלטים','ac_remotes_req']};const n=v=>Math.max(0,Number(v)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function token(){return localStorage.getItem(key)||''}function headers(){return {'Content-Type':'application/json','X-Field-Token':token()}}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers(),...(opt.headers||{})}});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Error(d.detail||'שגיאה');return d}async function login(){const t=document.getElementById('token').value.trim();if(!t)return;localStorage.setItem(key,t);try{rooms=await api('/field-api/rooms');showPicker();renderPicker()}catch(e){localStorage.removeItem(key);document.getElementById('loginMsg').className='msg err';document.getElementById('loginMsg').textContent='❌ קוד שגוי או שהמערכת אינה זמינה'}}async function boot(){if(token()){try{rooms=await api('/field-api/rooms');showPicker();renderPicker();return}catch{localStorage.removeItem(key)}}document.getElementById('login').classList.remove('hidden')}function roomNo(s){const m=String(s).match(/(\d{3})$/);return m?Number(m[1]):9999}function group(s){const x=roomNo(s),t=String(s);if(x>=101&&x<=108)return['🏢 קומה 1','101–108'];if(x>=201&&x<=212)return['🏢 קומה 2','201–212'];if(x>=301&&x<=313)return['🏢 קומה 3','301–313'];if(/^קרוון(?:\s|$)/.test(t))return['🏕️ מתחם קרוואנים','כל הקרוואנים'];return['📦 יחידות נוספות','יתר היחידות']}function hasGap(r){return Object.keys(fields).some(k=>n(r[k+'_act'])!==n(r[k+'_req']))}function renderPicker(){const q=document.getElementById('search').value.trim().toLowerCase();const map={};rooms.filter(r=>!q||String(r.apartment).toLowerCase().includes(q)).forEach(r=>{const g=group(r.apartment)[0];(map[g]??=[]).push(r)});document.getElementById('groups').innerHTML=Object.entries(map).map(([g,list])=>`<div class="group"><h3>${g}</h3><div class="rooms">${list.sort((a,b)=>roomNo(a.apartment)-roomNo(b.apartment)).map((r,i)=>`<button class="room ${r.inventory_checked?'checked':''} ${hasGap(r)?'gap':''}" onclick="openRoom('${encodeURIComponent(r.apartment)}')">${esc(r.apartment)}<small>${r.open_damage?'🛠️ נזק פתוח · ':''}${r.inventory_checked?(hasGap(r)?'🟠 נבדק ויש פער':'🟢 נבדק'):'⚪ טרם נבדק'}</small></button>`).join('')}</div></div>`).join('')||'<div class="card muted">לא נמצא חדר.</div>'}function openRoom(encoded){current=rooms.findIndex(r=>r.apartment===decodeURIComponent(encoded));if(current<0)return;const r=rooms[current];document.getElementById('picker').classList.add('hidden');document.getElementById('report').classList.remove('hidden');document.getElementById('actions').classList.remove('hidden');document.getElementById('roomTitle').textContent=r.apartment;document.getElementById('msg').textContent='';document.getElementById('inventory').innerHTML=Object.entries(fields).map(([k,v])=>`<div class="item"><b>${v[0]}</b><div class="grid"><div class="box"><small>צריך להיות</small><strong>${n(r[k+'_req'])}</strong></div><div class="box"><small>קיים בפועל</small><input id="act-${k}" type="number" min="0" max="1000" value="${n(r[k+'_act'])}" oninput="updateGap('${k}')"></div><div class="box"><small>פער</small><strong id="gap-${k}">${n(r[k+'_act'])-n(r[k+'_req'])}</strong></div></div></div>`).join('');document.getElementById('hasDamage').value='no';damageDrafts=[];document.getElementById('damageArea').classList.add('hidden');document.getElementById('damages').innerHTML=''}function updateGap(k){const r=rooms[current];document.getElementById('gap-'+k).textContent=n(document.getElementById('act-'+k).value)-n(r[k+'_req'])}function toggleDamage(){const yes=document.getElementById('hasDamage').value==='yes';document.getElementById('damageArea').classList.toggle('hidden',!yes);if(yes&&!damageDrafts.length)addDamage()}function addDamage(){damageDrafts.push({category:'FURNITURE',severity:'MEDIUM',description:''});renderDamages()}function removeDamage(i){damageDrafts.splice(i,1);renderDamages()}function renderDamages(){document.getElementById('damages').innerHTML=damageDrafts.map((d,i)=>`<div class="damage-row"><div class="damage-head"><b>נזק ${i+1}</b><button class="remove" onclick="removeDamage(${i})">הסר</button></div><div class="field"><label>קטגוריה</label><select onchange="damageDrafts[${i}].category=this.value"><option value="FURNITURE" ${d.category==='FURNITURE'?'selected':''}>ריהוט</option><option value="ELECTRICAL" ${d.category==='ELECTRICAL'?'selected':''}>חשמל</option><option value="PLUMBING" ${d.category==='PLUMBING'?'selected':''}>אינסטלציה</option><option value="STRUCTURE" ${d.category==='STRUCTURE'?'selected':''}>מבנה</option><option value="CLEANLINESS" ${d.category==='CLEANLINESS'?'selected':''}>ניקיון</option><option value="HVAC" ${d.category==='HVAC'?'selected':''}>מיזוג</option><option value="OTHER" ${d.category==='OTHER'?'selected':''}>אחר</option></select></div><div class="field"><label>חומרה</label><select onchange="damageDrafts[${i}].severity=this.value"><option value="LOW" ${d.severity==='LOW'?'selected':''}>נמוכה</option><option value="MEDIUM" ${d.severity==='MEDIUM'?'selected':''}>בינונית</option><option value="HIGH" ${d.severity==='HIGH'?'selected':''}>גבוהה</option><option value="CRITICAL" ${d.severity==='CRITICAL'?'selected':''}>קריטית</option></select></div><div class="field"><label>תיאור</label><textarea onchange="damageDrafts[${i}].description=this.value" placeholder="תאר את הנזק">${esc(d.description)}</textarea></div></div>`).join('')}function showPicker(){document.getElementById('report').classList.add('hidden');document.getElementById('actions').classList.add('hidden');document.getElementById('picker').classList.remove('hidden');renderPicker()}async function saveRoom(){const r=rooms[current],msg=document.getElementById('msg');const values={apartment:r.apartment};Object.keys(fields).forEach(k=>values[k]=n(document.getElementById('act-'+k).value));if(document.getElementById('hasDamage').value==='yes'&&damageDrafts.some(d=>d.description.trim().length<5)){msg.className='msg err';msg.textContent='❌ לכל נזק צריך להוסיף תיאור של לפחות 5 תווים';return}msg.className='msg';msg.textContent='שומר...';try{await api('/field-api/inventory',{method:'POST',body:JSON.stringify(values)});for(const d of damageDrafts)await api('/field-api/damages',{method:'POST',body:JSON.stringify({apartment:r.apartment,category:d.category,severity:d.severity,description:d.description})});Object.keys(fields).forEach(k=>r[k+'_act']=values[k]);r.inventory_checked=true;msg.className='msg ok';msg.textContent='✅ הבדיקה נשמרה בהצלחה';setTimeout(showPicker,500)}catch(e){msg.className='msg err';msg.textContent='❌ '+e.message}}function move(delta){const ni=current+delta;if(ni>=0&&ni<rooms.length)openRoom(encodeURIComponent(rooms[ni].apartment))}boot();</script></body></html>
