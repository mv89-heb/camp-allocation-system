<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>דיווח חדרים | מערכת הקמפוס</title><style>:root{--bg:#f4f6fa;--card:#fff;--text:#182230;--muted:#667085;--line:#d9dee7;--primary:#4f46e5;--ok:#027a48;--okbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--warn:#b54708;--infobg:#eff8ff;--info:#175cd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:14px 14px 115px}.top{position:sticky;top:0;z-index:30;background:rgba(244,246,250,.97);backdrop-filter:blur(10px);padding:4px 0 12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:19px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.btn,.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.progress{margin-top:10px;background:#e7eaf0;border-radius:999px;height:8px;overflow:hidden}.progress>div{height:100%;background:var(--primary);width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}.card,.section{background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:10px;padding:13px}.pickerlabel{font-size:13px;font-weight:900;margin-bottom:7px}.card>select{width:100%;border:1px solid #cbd3df;border-radius:12px;padding:13px;background:#fff;font-size:16px;font-weight:750}.floor{border:1px solid var(--line);border-radius:14px;margin-top:9px;overflow:hidden}.floorhead{padding:11px 13px;background:#f8fafc;font-weight:900;display:flex;justify-content:space-between}.floorcount{font-size:11px;color:var(--muted)}.roomlist{padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.roomchoice{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:right;font-weight:800}.roomchoice.active{border-color:var(--primary);background:#eef0ff;color:var(--primary)}.roomchoice.checked:after{content:' ✓';color:var(--ok)}.roomhead{background:linear-gradient(135deg,#fff,#f8f9ff);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.roomtitle{font-size:27px;font-weight:950}.roommeta{color:var(--muted);font-size:12px;margin-top:3px}.section h2{font-size:16px;margin:0 0 10px}.item{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff;margin-top:9px}.itemtop,.checkrow{display:flex;justify-content:space-between;align-items:center;gap:8px}.itemname{font-weight:900}.numbers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.numbox{background:#f8fafc;border-radius:10px;padding:8px;text-align:center}.numbox small{display:block;color:var(--muted);font-size:10px}.numbox strong{font-size:19px}.gapok{color:var(--ok)}.gapbad{color:var(--bad)}.gapwarn{color:var(--warn)}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd3df;border-radius:11px;padding:12px;background:#fff;font-size:16px}.field textarea{min-height:90px}.badge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.checked{background:var(--okbg);color:var(--ok)}.unchecked{background:#f2f4f7;color:var(--muted)}.damage-toggle{display:flex;gap:8px}.toggle{flex:1;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:850}.toggle.active.no{background:var(--okbg);color:var(--ok)}.toggle.active.yes{background:var(--badbg);color:var(--bad)}.notice{padding:10px 11px;border-radius:11px;background:var(--infobg);color:var(--info);font-size:12px;line-height:1.5}.existing{display:grid;gap:8px;margin-top:10px}.damage-card{border:1px solid #f0c0bc;background:#fff8f7;border-radius:12px;padding:10px}.damage-card b{color:var(--bad)}.message{margin-top:8px;font-size:13px;font-weight:800}.error{color:var(--bad)}.success{color:var(--ok)}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 14px;z-index:40}.bottomin{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px}.bottom .btn{padding:13px 7px}@media(min-width:700px){.app{padding-top:24px}.top{position:static}.roomlist{grid-template-columns:repeat(4,1fr)}.bottom{position:static;background:transparent;border:0}.roomtitle{font-size:30px}}</style></head><body><div class="app"><header class="top"><div class="topbar"><div><div class="brand">📋 דיווח ובקרת חדרים</div><div class="sub">בחר חדר מהרשימה • בדוק בפועל • דווח נזקים • שמור</div></div><button class="iconbtn" onclick="reload()">🔄</button></div><div class="progress"><div id="progressBar"></div></div><div class="stats"><div class="stat"><b id="statCurrent">—</b><span>חדר נבחר</span></div><div class="stat"><b id="statChecked">0</b><span>נבדקו</span></div><div class="stat"><b id="statRemaining">0</b><span>נותרו</span></div></div></header><main id="content"><div class="empty">טוען חדרים...</div></main></div><div class="bottom"><div class="bottomin"><button class="btn" onclick="prevRoom()">← הקודם</button><button class="btn primary" onclick="saveRoom()">💾 שמור חדר</button><button class="btn" onclick="nextRoom()">הבא →</button></div></div><script>
let rooms=[],index=0,loading=false;
const labels={beds:['🛏️','מיטות'],mattresses:['🛏️','מזרנים'],closets:['🚪','ארונות'],ac_units:['❄️','מזגנים'],ac_remotes:['🎛️','שלטים']};
const cats={FURNITURE:'ריהוט',ELECTRICAL:'חשמל',PLUMBING:'אינסטלציה',STRUCTURE:'מבנה',CLEANLINESS:'ניקיון',HVAC:'מיזוג',OTHER:'אחר'};
const sev={LOW:'נמוכה',MEDIUM:'בינונית',HIGH:'גבוהה',CRITICAL:'קריטית'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function roomNumber(name){const m=String(name||'').match(/(\d{3})$/);return m?Number(m[1]):null}
function groupOf(name){const n=roomNumber(name);if(n>=101&&n<=108)return'floor1';if(n>=201&&n<=212)return'floor2';if(n>=301&&n<=313)return'floor3';if(/^קרוון(?:\s|$)/.test(String(name||'')))return'caravans';return'other'}
function sortRooms(list){const g={floor1:[],floor2:[],floor3:[],caravans:[],other:[]};list.forEach(r=>g[groupOf(r.apartment)].push(r));Object.values(g).forEach(a=>a.sort((x,y)=>{const nx=roomNumber(x.apartment),ny=roomNumber(y.apartment);if(nx!==null&&ny!==null)return nx-ny;return String(x.apartment).localeCompare(String(y.apartment),'he')}));return[...g.floor1,...g.floor2,...g.floor3,...g.caravans,...g.other]}
function checkedCount(){return rooms.filter(r=>r.inventory_checked).length}
function updateStats(){const r=rooms[index];document.getElementById('statCurrent').textContent=r?r.apartment:'—';document.getElementById('statChecked').textContent=checkedCount();document.getElementById('statRemaining').textContent=Math.max(0,rooms.length-checkedCount());document.getElementById('progressBar').style.width=rooms.length?checkedCount()/rooms.length*100+'%':'0%'}
const floors=[['floor1','🏢 קומה 1','חדרים 101–108'],['floor2','🏢 קומה 2','חדרים 201–212'],['floor3','🏢 קומה 3','חדרים 301–313'],['caravans','🏕️ מתחם קרוואנים','כל הקרוואנים יחד'],['other','📦 יחידות נוספות','כל מה שאינו בקומות']];
function picker(){const g={};rooms.forEach(r=>(g[groupOf(r.apartment)]??=[]).push(r));return`<section class="card"><div class="pickerlabel">🎯 בחר חדר לדיווח</div><select onchange="selectRoom(this.value)"><option value="">בחר חדר מהרשימה...</option>${floors.map(f=>g[f[0]]?.length?`<optgroup label="${f[1]} — ${f[2]}">${g[f[0]].map(r=>`<option value="${esc(r.apartment)}" ${rooms[index]?.apartment===r.apartment?'selected':''}>${esc(r.apartment)}${r.inventory_checked?' ✓':''}</option>`).join('')}</optgroup>`:'').join('')}</select>${floors.map(f=>{const a=g[f[0]]||[];return a.length?`<div class="floor"><div class="floorhead"><span>${f[1]}</span><span class="floorcount">${f[2]} • ${a.length}</span></div><div class="roomlist">${a.map(r=>`<button class="roomchoice ${rooms[index]?.apartment===r.apartment?'active':''} ${r.inventory_checked?'checked':''}" data-room="${esc(r.apartment)}">${esc(r.apartment)}</button>`).join('')}</div></div>`:''}).join('')}</section>`}
async function reload(){try{document.getElementById('content').innerHTML='<div class="empty">טוען...</div>';rooms=sortRooms(await api('/analyze?mode=std'));index=Math.min(index,Math.max(0,rooms.length-1));render()}catch(e){document.getElementById('content').innerHTML='<div class="section error">לא ניתן לטעון את החדרים: '+esc(e.message)+'</div>'}}
function selectRoom(name){const i=rooms.findIndex(r=>r.apartment===name);if(i>=0){index=i;render();scrollTo({top:0,behavior:'smooth'})}}
function render(){updateStats();if(!rooms.length){document.getElementById('content').innerHTML='<div class="empty">אין חדרים לבדיקה.</div>';return}const r=rooms[index];const items=Object.entries(labels).map(([k,[icon,n]])=>{const req=Number(r[k+'_req']??0),act=Number(r[k+'_act']??0),gap=act-req,cl=gap===0?'gapok':gap<0?'gapbad':'gapwarn',sg=gap>0?'+':'';return`<div class="item"><div class="itemtop"><span class="itemname">${icon} ${n}</span><span>${gap===0?'🟢':gap<0?'🔴':'🟠'}</span></div><div class="numbers"><div class="numbox"><small>צריך להיות</small><strong>${req}</strong></div><div class="numbox"><small>קיים בפועל</small><strong>${act}</strong></div><div class="numbox"><small>פער</small><strong class="${cl}">${sg}${gap}</strong></div></div><div class="field"><label>${n} — כמות שנמצאה בפועל</label><input id="${k}" type="number" min="0" max="1000" inputmode="numeric" value="${act}"></div></div>`}).join('');document.getElementById('content').innerHTML=picker()+`<div class="room"><section class="roomhead"><div class="roomtitle">${esc(r.apartment)}</div><div class="roommeta">${groupOf(r.apartment)==='floor1'?'🏢 קומה 1':groupOf(r.apartment)==='floor2'?'🏢 קומה 2':groupOf(r.apartment)==='floor3'?'🏢 קומה 3':groupOf(r.apartment)==='caravans'?'🏕️ מתחם קרוואנים':'📦 יחידה נוספת'}</div></section><section class="section"><div class="checkrow"><h2>📦 מצאי בפועל</h2><span class="badge ${r.inventory_checked?'checked':'unchecked'}">${r.inventory_checked?'✅ נבדק':'⚪ טרם נבדק'}</span></div>${items}</section><section class="section"><h2>🛠️ בקרת נזקים</h2><div class="notice">בדוק את החדר. אם יש נזק, פתח דיווח כאן. הדיווח נשמר ישירות במערכת.</div><div class="damage-toggle"><button id="damageYes" class="toggle" onclick="setDamage(true)">🔴 יש נזק</button><button id="damageNo" class="toggle active no" onclick="setDamage(false)">🟢 אין נזק</button></div><div id="damageForm" class="hidden"><div class="field"><label>קטגוריה</label><select id="dCategory"><option value="FURNITURE">ריהוט</option><option value="ELECTRICAL">חשמל</option><option value="PLUMBING">אינסטלציה</option><option value="STRUCTURE">מבנה</option><option value="CLEANLINESS">ניקיון</option><option value="HVAC">מיזוג</option><option value="OTHER">אחר</option></select></div><div class="field"><label>חומרה</label><select id="dSeverity"><option value="LOW">נמוכה</option><option value="MEDIUM" selected>בינונית</option><option value="HIGH">גבוהה</option><option value="CRITICAL">קריטית</option></select></div><div class="field"><label>מה הנזק?</label><textarea id="dDescription" placeholder="תאר מה נמצא בחדר"></textarea></div><div class="field"><label>עלות משוערת</label><input id="dEstimated" type="number" min="0" step="0.01"></div><div class="field"><label>אחראי / ספק</label><input id="dResponsible" maxlength="160"></div></div><div id="existing" class="existing"></div></section><div id="msg" class="message"></div></div>`;document.querySelectorAll('.roomchoice').forEach(b=>b.onclick=()=>selectRoom(b.dataset.room));loadDamages(r.apartment)}
function setDamage(yes){damageYes.className='toggle '+(yes?'active yes':'');damageNo.className='toggle '+(!yes?'active no':'');damageForm.classList.toggle('hidden',!yes)}
async function loadDamages(a){try{const rows=await api('/damages?apartment='+encodeURIComponent(a));existing.innerHTML=rows.length?'<b>דיווחי נזק קיימים:</b>'+rows.map(d=>`<div class="damage-card"><b>${esc(cats[d.category]||d.category)} • ${esc(sev[d.severity]||d.severity)}</b><div>${esc(d.description)}</div><div class="sub">סטטוס: ${esc(d.status)}</div></div>`).join(''):'<div class="sub">אין דיווחי נזק קיימים.</div>'}catch{existing.innerHTML='<div class="error">לא ניתן לטעון דיווחי נזק.</div>'}}
async function saveRoom(){if(loading)return;loading=true;const r=rooms[index],msg=document.getElementById('msg');try{const v={};for(const k of Object.keys(labels)){const n=Number(document.getElementById(k).value);if(!Number.isInteger(n)||n<0||n>1000)throw new Error('יש להזין כמויות שלמות בין 0 ל־1000');v[k]=n}await api('/update_actual',{method:'POST',body:JSON.stringify({apartment:r.apartment,...v})});Object.entries(v).forEach(([k,x])=>r[k+'_act']=x);r.inventory_checked=true;if(!damageForm.classList.contains('hidden')){const description=dDescription.value.trim();if(!description)throw new Error('יש לכתוב תיאור של הנזק');await api('/damages',{method:'POST',body:JSON.stringify({apartment:r.apartment,category:dCategory.value,severity:dSeverity.value,description,estimated_cost:dEstimated.value?Number(dEstimated.value):null,responsible_party:dResponsible.value.trim()||null,evidence_urls:[]})})}updateStats();render();setTimeout(()=>nextRoom(),700)}catch(e){msg.className='message error';msg.textContent='❌ '+e.message}finally{loading=false}}
function nextRoom(){if(index<rooms.length-1){index++;render();scrollTo({top:0,behavior:'smooth'})}}function prevRoom(){if(index>0){index--;render();scrollTo({top:0,behavior:'smooth'})}}reload();
</script></body></html>
