ace-between;align-items:center}.itemname{font-weight:900}.numbers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.numbox{background:#f8fafc;border-radius:10px;padding:8px;text-align:center}.numbox small{display:block;color:var(--muted);font-size:10px}.numbox strong{font-size:20px}.gapok{color:var(--ok)}.gapbad{color:var(--bad)}.gapwarn{color:var(--warn)}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd3df;border-radius:11px;padding:12px;background:#fff;font-size:16px}.field textarea{min-height:85px;resize:vertical}.damage-actions{display:flex;gap:8px}.damage-choice{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-weight:900}.damage-choice.active.no{background:var(--okbg);color:var(--ok);border-color:#a8d9bb}.damage-choice.active.yes{background:var(--badbg);color:var(--bad);border-color:#efb4af}.damage-form{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.damage-list{display:grid;gap:8px;margin-top:10px}.damage-card{border:1px solid #efc3be;background:#fff9f8;border-radius:13px;padding:11px}.damage-card .row{display:flex;justify-content:space-between;gap:8px;align-items:center}.damage-card p{margin:8px 0;font-size:13px;line-height:1.45}.damage-card small{color:var(--muted)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.photo-grid img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;border:1px solid var(--line)}.photo-input{width:100%;padding:10px;border:1px dashed #aeb7c6;border-radius:11px;background:#fafbfc}.message{margin-top:8px;font-size:13px;font-weight:800}.error{color:var(--bad)}.success{color:var(--ok)}.empty{padding:30px;text-align:center;color:var(--muted)}.offline{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:800;margin-top:8px}. </style></head><body><div class="app"><header class="top"><div class="topbar"><div><div class="brand">📋 בדיקת חדרים</div><div class="sub">בחר חדר אחד מהרשימה • בדוק • דווח • שמור</div></div><button class="iconbtn" onclick="loadRooms()">🔄</button></div><div id="offlineBar" class="hidden"></div><div class="progress"><div id="progressBar"></div></div><div class="stats"><div class="stat"><b id="statChecked">0</b><span>נבדקו</span></div><div class="stat"><b id="statRemaining">0</b><span>נותרו</span></div><div class="stat"><b id="statDamages">0</b><span>נזקים פתוחים</span></div></div><div class="toolbar"><button class="filter active" data-filter="all" onclick="setFilter('all')">הכול</button><button class="filter" data-filter="unchecked" onclick="setFilter('unchecked')">טרם נבדק</button><button class="filter" data-filter="gaps" onclick="setFilter('gaps')">יש פער</button><button class="filter" data-filter="damage" onclick="setFilter('damage')">יש נזק</button></div></header><main id="content"><div class="empty">טוען חדרים...</div></main></div><div class="bottom"><div class="bottomin"><button class="btn" onclick="previousRoom()">← הקודם</button><button class="btn primary" onclick="saveRoom()">💾 שמור וסיים חדר</button><button class="btn" onclick="nextRoom()">הבא →</button></div></div><div id="photoModal" class="modal hidden"><div class="modalbox"><div class="modalhead"><strong>📷 תמונות לנזק</strong><button class="iconbtn" onclick="closePhotos()">✕</button></div><div class="notice" style="margin-top:10px">אפשר לצלם עד 3 תמונות. התמונות יוקטןו לפני השמירה.</div><input id="photoInput" class="photo-input" style="margin-top:10px" type="file" accept="image/*" capture="environment" multiple onchange="handlePhotos(event)"><div id="photoGrid" class="photo-grid"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="closePhotos()">סיום</button></div></div><script>
const labels={beds:['🛏️','מיטות'],mattresses:['🛏️','מזרנים'],closets:['🚪','ארונות'],ac_units:['❄️','מזגנים'],ac_remotes:['🎛️','שלטים']},cats={FURNITURE:'ריהוט',ELECTRICAL:'חשמל',PLUMBING:'אינסטלציה',STRUCTURE:'מבנה',CLEANLINESS:'ניקיון',HVAC:'מיזוג',OTHER:'אחר'},sev={LOW:'נמוכה',MEDIUM:'בינונית',HIGH:'גבוהה',CRITICAL:'קריטית'},statuses={OPEN:'פתוח',INSPECTION:'בבדיקה',IN_PROGRESS:'בטיפול',RESOLVED:'טופל',CLOSED:'סגור'};
let rooms=[],damages=[],index=-1,filter='all',draftDamages=[],pendingPhotos=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function num(v){const n=Number(v);return Number.isFinite(n)&&n>=0?Math.min(1000,Math.floor(n)):0}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Object.assign(new Error(d.detail||('HTTP '+r.status)),{status:r.status});return d}
function roomNo(name){const m=String(name||'').match(/(\d{3})$/);return m?Number(m[1]):null}function group(name){const n=roomNo(name),s=String(name||'');if(n>=101&&n<=108)return['floor1','🏢 קומה 1','101–108'];if(n>=201&&n<=212)return['floor2','🏢 קומה 2','201–212'];if(n>=301&&n<=313)return['floor3','🏢 קומה 3','301–313'];if(/^קרוון(?:\s|$)/.test(s))return['caravans','🏕️ מתחם קרוואנים','כל הקרוואנים'];return['other','📦 יחידות נוספות','יתר היחידות']}
function sortRooms(a){const order={floor1:1,floor2:2,floor3:3,caravans:4,other:5};return a.sort((x,y)=>{const gx=group(x.apartment)[0],gy=group(y.apartment)[0];if(order[gx]!==order[gy])return order[gx]-order[gy];const nx=roomNo(x.apartment),ny=roomNo(y.apartment);if(nx!==null&&ny!==null)return nx-ny;return String(x.apartment).localeCompare(String(y.apartment),'he')})}
function checked(){return rooms.filter(r=>r.inventory_checked).length}function openDamageCount(){return damages.filter(d=>['OPEN','INSPECTION','IN_PROGRESS'].includes(d.status)).length}function updateHeader(){document.getElementById('statChecked').textContent=checked();document.getElementById('statRemaining').textContent=Math.max(0,rooms.length-checked());document.getElementById('statDamages').textContent=openDamageCount();document.getElementById('progressBar').style.width=rooms.length?(checked()/rooms.length*100)+'%':'0%';const b=document.getElementById('offlineBar');if(!navigator.onLine){b.className='offline';b.textContent='📴 אין חיבור. שמירות יישמרו בתור ויסתנכרנו כשיחזור האינטרנט.'}else{b.className='hidden';b.textContent=''}}
function roomGap(r){return Object.keys(labels).some(k=>num(r[k+'_act'])!==num(r[k+'_req']))}function roomHasDamage(r){return damages.some(d=>d.apartment===r.apartment&&['OPEN','INSPECTION','IN_PROGRESS'].includes(d.status))}
function setFilter(f){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===f));renderPicker()}function visibleRooms(){const q=(document.getElementById('roomSearch')?.value||'').trim().toLowerCase();return rooms.filter(r=>{if(q&&!String(r.apartment).toLowerCase().includes(q))return false;if(filter==='unchecked'&&r.inventory_checked)return false;if(filter==='gaps'&&!roomGap(r))return false;if(filter==='damage'&&!roomHasDamage(r))return false;return true})}
function renderPicker(){const list=visibleRooms(),groups={};list.forEach(r=>(groups[group(r.apartment)[0]]??=[]).push(r));const q=esc(document.getElementById('roomSearch')?.value||'');document.getElementById('content').innerHTML=`<section class="card"><div class="picker-title">🏠 בחר חדר לבדיקה</div><div class="picker-sub">זו רשימת הבחירה היחידה — אין תפריט כפול.</div><input id="roomSearch" class="search" placeholder="🔎 חפש חדר..." value="${q}" oninput="searchRooms(this.value)">${['floor1','floor2','floor3','caravans','other'].map(key=>{const a=groups[key]||[];if(!a.length)return'';const meta=group(a[0].apartment);return`<div class="group"><div class="grouphead"><b>${meta[1]}</b><span>${meta[2]} • ${a.length}</span></div><div class="rooms">${a.map(r=>{const selected=index>=0&&rooms[index]?.apartment===r.apartment,hasGap=roomGap(r),hasD=roomHasDamage(r);return`<button class="roombtn ${selected?'selected':''} ${r.inventory_checked?'checked':''} ${hasGap?'gap':''} ${hasD?'damage':''}" onclick="chooseRoom('${esc(r.apartment).replace(/'/g,'&#39;')}')"><b>${esc(r.apartment)}</b><span class="roomstate">${r.inventory_checked?(hasGap?'🔴 יש פער':'🟢 נבדק'):'⚪ טרם נבדק'}${hasD?' • 🛠️ נזק פתוח':''}</span></button>`}).join('')}</div></div>`}).join('')}${list.length?'':'<div class="empty">אין חדרים התואמים לחיפוש.</div>'}</section>`}
function searchRooms(v){const pos=v.length;renderPicker();const e=document.getElementById('roomSearch');e.focus();e.setSelectionRange(pos,pos)}function chooseRoom(name){const i=rooms.findIndex(r=>r.apartment===name);if(i<0)return;index=i;draftDamages=[];pendingPhotos=[];localStorage.setItem('camp_last_room',name);renderRoom();scrollTo({top:0,behavior:'smooth'})}
function statusFor(r){if(!r.inventory_checked)return['muted','⚪ טרם נבדק'];const gs=Object.keys(labels).map(k=>num(r[k+'_act'])-num(r[k+'_req']));if(gs.some(g=>g<0))return['bad','🔴 יש חוסרים'];if(gs.some(g=>g>0))return['warn','🟠 יש עודפים'];return['ok','🟢 תקין']}
function renderRoom(){if(index<0){renderPicker();updateHeader();return}const r=rooms[index],[sc,st]=statusFor(r);const items=Object.entries(labels).map(([k,[icon,n]])=>{const req=num(r[k+'_req']),act=num(r[k+'_act']),gap=act-req,cl=gap===0?'gapok':gap<0?'gapbad':'gapwarn';return`<div class="item"><div class="itemtop"><span class="itemname">${icon} ${n}</span><span class="badge ${gap===0?'ok':gap<0?'bad':'warn'}">${gap===0?'תקין':gap<0?'חסר':'עודף'}</span></div><div class="numbers"><div class="numbox"><small>צריך להיות</small><strong>${req}</strong></div><div class="numbox"><small>קיים בפועל</small><strong id="shown-${k}">${act}</strong></div><div class="numbox"><small>פער</small><strong id="gap-${k}" class="${cl}">${gap>0?'+':''}${gap}</strong></div></div><div class="field"><label>כמה נמצא בפועל?</label><input id="${k}" type="number" min="0" max="1000" inputmode="numeric" value="${act}" oninput="previewGap('${k}',this.value)"></div></div>`}).join('');const existing=damages.filter(d=>d.apartment===r.apartment);document.getElementById('content').innerHTML=`<section class="roomhead"><div class="roomtitle">${esc(r.apartment)}</div><div class="roommeta">${group(r.apartment)[1]} • <span class="badge ${sc}">${st}</span> ${r.inventory_checked?'• נבדק':'• טרם נבדק פיזית'}</div></section><section class="section"><div class="sectionhead"><h2>📦 מצאי בפועל</h2><span class="step">שלב 1 מתוך 2</span></div><div class="notice">המספר הגדול הוא מה שצריך להיות. הזן רק את הכמות שמצאת בפועל. הפער מחושב אוטומטית.</div>${items}</section><section class="section"><div class="sectionhead"><h2>🛠️ בקרת נזקים</h2><span class="step">שלב 2 מתוך 2</span></div><div class="damage-actions"><button id="damageNo" class="damage-choice active no" onclick="setDamage(false)">🟢 אין נזק</button><button id="damageYes" class="damage-choice" onclick="setDamage(true)">🔴 יש נזק</button></div><div id="damageForm" class="damage-form hidden">${damageForm()}</div>${existing.length?`<div class="field"><label>נזקים קיימים בחדר</label><div class="damage-list">${existing.map(damageCard).join('')}</div></div>`:''}</section><section class="section"><div class="sectionhead"><h2>🧾 סיכום</h2></div><div id="summaryBox" class="notice"></div><div id="saveMessage" class="message"></div></section>`;updateSummary();updateHeader()}
function previewGap(k,v){const r=rooms[index],req=num(r[k+'_req']),act=num(v),g=act-req,e=document.getElementById('shown-'+k),ge=document.getElementById('gap-'+k);e.textContent=act;ge.textContent=(g>0?'+':'')+g;ge.className=g===0?'gapok':g<0?'gapbad':'gapwarn';updateSummary()}
function updateSummary(){if(index<0)return;const r=rooms[index],gaps=Object.keys(labels).map(k=>num(document.getElementById(k)?.value??r[k+'_act'])-num(r[k+'_req'])),missing=gaps.filter(g=>g<0).length,extra=gaps.filter(g=>g>0).length;document.getElementById('summaryBox').innerHTML=missing?`🔴 יש חוסר ב־<b>${missing}</b> סוגי פריטים.${extra?` בנוסף יש עודף ב־<b>${extra}</b>.`:''}`:extra?`🟠 אין חוסרים. יש עודף ב־<b>${extra}</b> סוגי פריטים.`:'🟢 כל פריטי המצאי תואמים לתקן.'}
function damageForm(){return`<div class="field"><label>מה נפגע?</label><select id="dCategory"><option value="FURNITURE">ריהוט</option><option value="ELECTRICAL">חשמל</option><option value="PLUMBING">אינסטלציה</option><option value="STRUCTURE">מבנה</option><option value="CLEANLINESS">ניקיון</option><option value="HVAC">מיזוג</option><option value="OTHER">אחר</option></select></div><div class="field"><label>חומרה</label><select id="dSeverity"><option value="LOW">נמוכה</option><option value="MEDIUM" selected>בינונית</option><option value="HIGH">גבוהה</option><option value="CRITICAL">קריטית</option></select></div><div class="field"><label>תיאור הנזק</label><textarea id="dDescription" maxlength="5000" placeholder="מה בדיוק נמצא בחדר?"></textarea></div><div class="field"><label>עלות משוערת</label><input id="dEstimated" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label>אחראי / ספק</label><input id="dResponsible" maxlength="160"></div><div class="field"><label>תמונות</label><button type="button" class="btn" style="width:100%" onclick="openPhotos()">📷 צלם / בחר עד 3 תמונות</button><div id="photoGridInline" class="photo-grid"></div></div><button class="btn danger" style="width:100%;margin-top:10px" onclick="addDraftDamage()">＋ הוסף נזק לחדר</button><div id="draftList" class="damage-list"></div>`}
function setDamage(yes){document.getElementById('damageYes').classList.toggle('active',yes);document.getElementById('damageNo').classList.toggle('active',!yes);document.getElementById('damageForm').classList.toggle('hidden',!yes)}
function damageCard(d){const c=['HIGH','CRITICAL'].includes(d.severity)?'bad':d.severity==='MEDIUM'?'warn':'info';return`<div class="damage-card"><div class="row"><b>${esc(cats[d.category]||d.category)}</b><span class="badge ${c}">${esc(sev[d.severity]||d.severity)} • ${esc(statuses[d.status]||d.status)}</span></div><p>${esc(d.description)}</p><small>${esc(d.reported_by||'מערכת')} • ${new Date(d.reported_at).toLocaleString('he-IL')}</small><div class="field"><select id="status-${d.id}">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${d.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><input id="notes-${d.id}" placeholder="הערת טיפול / סגירה" value="${esc(d.resolution_notes||'')}"></div><button class="btn" style="margin-top:8px" onclick="saveDamageEdit(${d.id})">שמור עדכון</button></div>`}
function addDraftDamage(){const desc=document.getElementById('dDescription').value.trim();if(!desc){alert('יש להזין תיאור נזק');return}const cost=document.getElementById('dEstimated').value;draftDamages.push({category:document.getElementById('dCategory').value,severity:document.getElementById('dSeverity').value,description:desc,estimated_cost:cost===''?null:Number(cost),responsible_party:document.getElementById('dResponsible').value.trim()||null,evidence_urls:[...pendingPhotos]});pendingPhotos=[];document.getElementById('dDescription').value='';document.getElementById('dEstimated').value='';document.getElementById('dResponsible').value='';renderDrafts();renderInlinePhotos()}
function renderDrafts(){const e=document.getElementById('draftList');if(!e)return;e.innerHTML=draftDamages.map((d,i)=>`<div class="damage-card"><div class="row"><b>נזק #${i+1} — ${esc(cats[d.category])}</b><button class="iconbtn" onclick="draftDamages.splice(${i},1);renderDrafts()">✕</button></div><p>${esc(d.description)}</p><small>חומרה: ${esc(sev[d.severity])} • תמונות: ${d.evidence_urls.length}</small></div>`).join('')}
function openPhotos(){document.getElementById('photoModal').classList.remove('hidden');document.getElementById('photoGrid').innerHTML=pendingPhotos.map(x=>`<img src="${x}" alt="תמונה">`).join('')}function closePhotos(){document.getElementById('photoModal').classList.add('hidden');renderInlinePhotos()}function renderInlinePhotos(){const e=document.getElementById('photoGridInline');if(e)e.innerHTML=pendingPhotos.map(x=>`<img src="${x}" alt="תמונה">`).join('')}
function handlePhotos(ev){const files=[...ev.target.files].slice(0,3-pendingPhotos.length);files.forEach(f=>compressImage(f).then(x=>{pendingPhotos.push(x);openPhotos()}).catch(()=>{}));ev.target.value=''}function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function saveRoom(){if(index<0)return;const r=rooms[index],values={};Object.keys(labels).forEach(k=>values[k]=num(document.getElementById(k)?.value??r[k+'_act']));try{document.getElementById('saveMessage').textContent='שומר...';await saveOrQueue('/update_actual',{method:'POST',body:JSON.stringify({apartment:r.apartment,...values})});for(const d of draftDamages)await saveOrQueue('/damages',{method:'POST',body:JSON.stringify({apartment:r.apartment,...d})});draftDamages=[];pendingPhotos=[];await loadRooms(true);document.getElementById('saveMessage').innerHTML='<span class="success">✅ החדר נשמר בהצלחה.</span>';const next=rooms.findIndex(x=>!x.inventory_checked);if(next>=0)index=next;renderRoom();window.scrollTo({top:0,behavior:'smooth'})}catch(e){document.getElementById('saveMessage').innerHTML='<span class="error">❌ '+esc(e.message)+'</span>'}}
async function saveOrQueue(path,opt){if(navigator.onLine){try{return await api(path,opt)}catch(e){if(e.status&&e.status<500)throw e}}const q=JSON.parse(localStorage.getItem('camp_sync_queue')||'[]');q.push({path,opt,created_at:new Date().toISOString()});localStorage.setItem('camp_sync_queue',JSON.stringify(q));return{queued:true}}
async function flushQueue(){if(!navigator.onLine)return;const q=JSON.parse(localStorage.getItem('camp_sync_queue')||'[]');if(!q.length)return;const remain=[];for(const item of q){try{await api(item.path,item.opt)}catch{remain.push(item)}}localStorage.setItem('camp_sync_queue',JSON.stringify(remain))}
async function loadRooms(keep=false){try{await flushQueue();const [rs,ds]=await Promise.all([api('/analyze?mode=std'),api('/damages')]);rooms=sortRooms(rs);damages=ds;updateHeader();if(!keep){const saved=localStorage.getItem('camp_last_room');index=saved?rooms.findIndex(r=>r.apartment===saved):-1}if(index>=rooms.length)index=rooms.length-1;renderPicker();if(index>=0)renderRoom()}catch(e){document.getElementById('content').innerHTML='<div class="section error">לא ניתן לטעון את הנתונים: '+esc(e.message)+'</div>';updateHeader()}}
function nextRoom(){if(index<0){const i=rooms.findIndex(r=>!r.inventory_checked);if(i>=0)chooseRoom(rooms[i].apartment);return}if(index<rooms.length-1){index++;localStorage.setItem('camp_last_room',rooms[index].apartment);renderRoom();window.scrollTo({top:0,behavior:'smooth'})}}function previousRoom(){if(index>0){index--;localStorage.setItem('camp_last_room',rooms[index].apartment);renderRoom();window.scrollTo({top:0,behavior:'smooth'})}}
async function saveDamageEdit(id){const status=document.getElementById('status-'+id).value,notes=document.getElementById('notes-'+id).value.trim();if(['RESOLVED','CLOSED'].includes(status)&&!notes){alert('לפני סימון כטופל/סגור יש להזין הערת טיפול');return}try{await api('/damages/'+id,{method:'PATCH',body:JSON.stringify({status,resolution_notes:notes})});await loadRooms(true);renderRoom()}catch(e){alert(e.message)}}
window.addEventListener('online',()=>{flushQueue().then(loadRooms)});window.addEventListener('offline',updateHeader);window.addEventListener('DOMContentLoaded',()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('/static/sw.js').catch(()=>{});loadRooms()});
</script></body></html>
