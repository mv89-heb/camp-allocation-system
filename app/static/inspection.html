<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>בדיקת חדרים | מערכת הקמפוס</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#182230;--muted:#667085;--line:#d9dee7;--primary:#4f46e5;--primary-dark:#3730a3;--ok:#027a48;--okbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--warn:#b54708;--warnbg:#fffaeb;--info:#175cd3;--infobg:#eff8ff}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding:14px 14px 110px}.top{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.96);backdrop-filter:blur(10px);padding:4px 0 12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:19px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:3px}.iconbtn,.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:active{background:var(--primary-dark)}.btn.success{background:var(--ok);border-color:var(--ok);color:#fff}.btn.danger{background:var(--badbg);border-color:#f4b7b2;color:var(--bad)}.progress{margin-top:10px;background:#e7eaf0;border-radius:999px;height:8px;overflow:hidden}.progress>div{height:100%;background:var(--primary);width:0;transition:.2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}.room{margin-top:10px}.roomhead{background:linear-gradient(135deg,#fff,#f8f9ff);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 10px #00000008}.roomtitle{font-size:26px;font-weight:900}.roommeta{color:var(--muted);font-size:12px;margin-top:3px}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;padding:13px}.section h2{font-size:16px;margin:0 0 10px}.items{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.itemtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.itemname{font-weight:850}.numbers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}.numbox{background:#f8fafc;border-radius:10px;padding:8px;text-align:center}.numbox small{display:block;color:var(--muted);font-size:10px}.numbox strong{font-size:19px}.gapok{color:var(--ok)}.gapbad{color:var(--bad)}.gapwarn{color:var(--warn)}.checkrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.checkbadge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--info);color:#fff}.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd3df;border-radius:11px;padding:12px;background:#fff;font-size:16px}.field textarea{min-height:90px;resize:vertical}.damage-toggle{display:flex;gap:8px}.toggle{flex:1;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800}.toggle.active{background:var(--badbg);border-color:#f0aaa5;color:var(--bad)}.hidden{display:none!important}.notice{padding:10px 11px;border-radius:11px;background:var(--infobg);color:var(--info);font-size:12px;line-height:1.5}.existing{display:grid;gap:8px}.damage-card{border:1px solid #f0c0bc;background:#fff8f7;border-radius:12px;padding:10px}.damage-card b{color:var(--bad)}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom));z-index:30}.bottomin{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}.bottom .btn{padding:13px 8px}.savebar{margin-top:10px;display:grid;grid-template-columns:1fr;gap:8px}.message{margin-top:8px;font-size:13px;font-weight:750}.error{color:var(--bad)}.success{color:var(--ok)}.empty{padding:30px 10px;text-align:center;color:var(--muted)}@media(min-width:700px){.app{padding-top:24px}.top{position:static}.bottom{position:static;background:transparent;border:0;padding:10px 0}.bottomin{max-width:none}.roomtitle{font-size:30px}.items{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="topbar"><div><div class="brand">📋 בדיקת חדרים</div><div class="sub">מצאי בפועל • פערים • בקרת נזקים</div></div><button class="iconbtn" onclick="reload()">🔄</button></div>
 <div class="progress"><div id="progressBar"></div></div>
 <div class="stats"><div class="stat"><b id="statCurrent">1</b><span>חדר נוכחי</span></div><div class="stat"><b id="statChecked">0</b><span>נבדקו</span></div><div class="stat"><b id="statRemaining">0</b><span>נותרו</span></div></div>
</header>
<main id="content"><div class="empty">טוען חדרים...</div></main>
</div>
<div class="bottom"><div class="bottomin"><button class="btn" onclick="prevRoom()">← הקודם</button><button class="btn primary" id="saveBtn" onclick="saveRoom()">💾 שמור וסיים חדר</button><button class="btn" onclick="nextRoom()">הבא →</button></div></div>
<script>
let rooms=[];let index=0;let loading=false;
const labels={beds:['🛏️','מיטות'],mattresses:['🛏️','מזרנים'],closets:['🚪','ארונות'],ac_units:['❄️','מזגנים'],ac_remotes:['🎛️','שלטים']};
const cats={FURNITURE:'ריהוט',ELECTRICAL:'חשמל',PLUMBING:'אינסטלציה',STRUCTURE:'מבנה',CLEANLINESS:'ניקיון',HVAC:'מיזוג',OTHER:'אחר'};
const sev={LOW:'נמוכה',MEDIUM:'בינונית',HIGH:'גבוהה',CRITICAL:'קריטית'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
async function reload(){try{document.getElementById('content').innerHTML='<div class="empty">טוען...</div>';rooms=await api('/analyze?mode=std');index=Math.min(index,Math.max(0,rooms.length-1));render()}catch(e){document.getElementById('content').innerHTML='<div class="section"><div class="error">לא ניתן לטעון את החדרים: '+esc(e.message)+'</div></div>'}}
function checkedCount(){return rooms.filter(r=>r.inventory_checked).length}
function render(){if(!rooms.length){document.getElementById('content').innerHTML='<div class="empty">אין חדרים לבדיקה.</div>';return}const r=rooms[index];document.getElementById('statCurrent').textContent=(index+1)+'/'+rooms.length;document.getElementById('statChecked').textContent=checkedCount();document.getElementById('statRemaining').textContent=rooms.length-checkedCount();document.getElementById('progressBar').style.width=((index+1)/rooms.length*100)+'%';document.getElementById('saveBtn').textContent=r.inventory_checked?'💾 עדכן בדיקה':'💾 שמור וסיים חדר';
let items=Object.entries(labels).map(([key,[icon,name]])=>{const req=Number(r[key+'_req']||0),act=Number(r[key+'_act']||0),gap=act-req;const cls=gap===0?'gapok':gap<0?'gapbad':'gapwarn';const sign=gap>0?'+':'';return `<div class="item"><div class="itemtop"><span class="itemname">${icon} ${name}</span><span>${gap===0?'🟢':gap<0?'🔴':'🟠'}</span></div><div class="numbers"><div class="numbox"><small>צריך להיות</small><strong>${req}</strong></div><div class="numbox"><small>קיים בפועל</small><strong>${act}</strong></div><div class="numbox"><small>פער</small><strong class="${cls}">${sign}${gap}</strong></div></div><div class="field"><label>${name} — עדכון בפועל</label><input id="${key}" type="number" min="0" max="1000" inputmode="numeric" value="${act}"></div></div>`}).join('');
document.getElementById('content').innerHTML=`<div class="room"><section class="roomhead"><div class="roomtitle">${esc(r.apartment)}</div><div class="roommeta">חדר ${index+1} מתוך ${rooms.length}</div></section><section class="section"><div class="checkrow"><h2>📦 מצאי החדר</h2><span class="checkbadge">${r.inventory_checked?'✅ נבדק':'⚪ טרם נבדק'}</span></div><div class="items">${items}</div></section><section class="section"><h2>🛠️ בקרת נזקים</h2><div class="notice">בדוק את החדר בזמן אמת. אם יש נזק, דווח עליו כאן. הדיווח נשמר מיד במערכת ומקושר לחדר.</div><div class="damage-toggle"><button id="damageYes" class="toggle" onclick="setDamage(true)">🔴 יש נזק</button><button id="damageNo" class="toggle active" onclick="setDamage(false)">🟢 אין נזק</button></div><div id="damageForm" class="hidden"><div class="field"><label>קטגוריה</label><select id="dCategory"><option value="FURNITURE">ריהוט</option><option value="ELECTRICAL">חשמל</option><option value="PLUMBING">אינסטלציה</option><option value="STRUCTURE">מבנה</option><option value="CLEANLINESS">ניקיון</option><option value="HVAC">מיזוג</option><option value="OTHER">אחר</option></select></div><div class="field"><label>חומרה</label><select id="dSeverity"><option value="LOW">נמוכה</option><option value="MEDIUM" selected>בינונית</option><option value="HIGH">גבוהה</option><option value="CRITICAL">קריטית</option></select></div><div class="field"><label>מה הנזק?</label><textarea id="dDescription" placeholder="תאר בקצרה וברור מה נמצא בחדר"></textarea></div><div class="field"><label>עלות משוערת (אופציונלי)</label><input id="dEstimated" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label>אחראי / ספק (אופציונלי)</label><input id="dResponsible" maxlength="160"></div></div><div id="existing" class="existing" style="margin-top:10px"></div></section><div id="msg" class="message"></div></div>`;loadExistingDamages(r.apartment)}
function setDamage(yes){document.getElementById('damageYes').classList.toggle('active',yes);document.getElementById('damageNo').classList.toggle('active',!yes);document.getElementById('damageForm').classList.toggle('hidden',!yes)}
async function loadExistingDamages(apartment){try{const rows=await api('/damages?apartment='+encodeURIComponent(apartment));document.getElementById('existing').innerHTML=rows.length?'<div style="font-weight:800">דיווחים קיימים בחדר:</div>'+rows.map(d=>`<div class="damage-card"><b>${esc(cats[d.category]||d.category)} • ${esc(sev[d.severity]||d.severity)}</b><div>${esc(d.description)}</div><div class="sub">סטטוס: ${esc(d.status)} • ${esc(d.reported_at)}</div></div>`).join(''):'<div class="sub">אין דיווחי נזק קיימים.</div>'}catch(e){document.getElementById('existing').innerHTML='<div class="error">לא ניתן לטעון דיווחי נזק.</div>'}}
function vals(){const out={};for(const k of Object.keys(labels)){const n=Number(document.getElementById(k).value);if(!Number.isInteger(n)||n<0||n>1000)throw new Error('יש להזין כמויות שלמות בין 0 ל־1000');out[k]=n}return out}
async function saveRoom(){if(loading)return;loading=true;const r=rooms[index];const msg=document.getElementById('msg');try{const v=vals();await api('/update_actual',{method:'POST',body:JSON.stringify({apartment:r.apartment,...v})});if(document.getElementById('damageYes').classList.contains('active')){const description=document.getElementById('dDescription').value.trim();if(!description)throw new Error('אם יש נזק, יש לתאר אותו');const est=document.getElementById('dEstimated').value;await api('/damages',{method:'POST',body:JSON.stringify({apartment:r.apartment,category:document.getElementById('dCategory').value,severity:document.getElementById('dSeverity').value,description,estimated_cost:est===''?null:Number(est),responsible_party:document.getElementById('dResponsible').value.trim()||null,evidence_urls:[]})})}msg.className='message success';msg.textContent='נשמר בהצלחה במערכת ✓';await reload();if(index<rooms.length-1){setTimeout(()=>{index++;render()},250)}}catch(e){msg.className='message error';msg.textContent=e.message}finally{loading=false}}
function nextRoom(){if(index<rooms.length-1){index++;render();window.scrollTo({top:0,behavior:'smooth'})}}
function prevRoom(){if(index>0){index--;render();window.scrollTo({top:0,behavior:'smooth'})}}
window.addEventListener('DOMContentLoaded',reload);
</script>
</body>
</html>
