<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול חדרים</title>
<style>
body{margin:0;background:#f4f6fa;color:#172033;font-family:Segoe UI,Tahoma,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:24px;margin:0}.sub{color:#667085;font-size:13px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input{padding:11px;border:1px solid #cfd6df;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:#fff}.secondary{background:#fff;border:1px solid #dfe4ea}.msg{margin-top:10px;font-weight:700}.ok{color:#027a48}.err{color:#b42318}.room{padding:11px;border:1px solid #dfe4ea;border-radius:11px;margin-top:8px;background:#fafbfc}.room b{font-size:16px}.room small{display:block;color:#667085;margin-top:4px}@media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.app{padding:10px}}
</style></head>
<body><main class="app">
<a href="/" class="btn secondary">← חזרה למערכת</a>
<div class="card"><h1>➕ הוספת חדר</h1><div class="sub">החדר ייווצר כתקן + מצאי התחלתי 0, ויופיע כ״טרם נבדק״.</div>
<form id="form" class="grid" style="margin-top:14px">
<div class="field full"><label>שם חדר / יחידה</label><input id="apartment" maxlength="120" required placeholder="למשל: ירושלים 213 או קרוון 10"></div>
<div class="field"><label>מיטות — תקן</label><input id="beds_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>מזרנים — תקן</label><input id="mattresses_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>ארונות — תקן</label><input id="closets_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>מזגנים — תקן</label><input id="ac_units_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>שלטים — תקן</label><input id="ac_remotes_std" type="number" min="0" max="1000" value="1"></div>
<div class="field"><label>מיטות — תקן מתוכנן</label><input id="beds_plan" type="number" min="0" max="1000" value="6"></div>
<div class="field"><label>מזרנים — תקן מתוכנן</label><input id="mattresses_plan" type="number" min="0" max="1000" value="6"></div>
<div class="field"><label>ארונות — תקן מתוכנן</label><input id="closets_plan" type="number" min="0" max="1000" value="6"></div>
<div class="field"><label>מזגנים — תקן מתוכנן</label><input id="ac_units_plan" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>שלטים — תקן מתוכנן</label><input id="ac_remotes_plan" type="number" min="0" max="1000" value="1"></div>
<div class="field full"><button class="btn primary" type="submit">💾 צור חדר</button></div>
</form><div id="msg" class="msg"></div></div>
<div class="card"><h2>חדרים שנוספו</h2><div id="rooms">טוען...</div></div>
</main>
<script>
const $=id=>document.getElementById(id);const fields=['beds_std','mattresses_std','closets_std','ac_units_std','ac_remotes_std','beds_plan','mattresses_plan','closets_plan','ac_units_plan','ac_remotes_plan'];
async function load(){try{const r=await fetch('/field-api/rooms');if(!r.ok)throw new Error('לא ניתן לטעון חדרים');const data=await r.json();$('rooms').innerHTML=data.map(x=>`<div class="room"><b>${esc(x.apartment)}</b><small>${esc(x.group)} · ${x.inventory_checked?'נבדק':'טרם נבדק'} · בפועל: ${x.beds_act}/${x.mattresses_act}/${x.closets_act}/${x.ac_units_act}/${x.ac_remotes_act}</small></div>`).join('')||'אין חדרים';}catch(e){$('rooms').textContent=e.message}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='שומר...';const body={apartment:$('apartment').value};fields.forEach(k=>body[k]=Math.max(0,Number($(k).value)||0));try{const r=await fetch('/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'שגיאה ביצירת החדר');$('msg').className='msg ok';$('msg').textContent=`✅ החדר ${d.apartment} נוצר בהצלחה`;e.target.reset();['beds_std','mattresses_std','closets_std','ac_units_std'].forEach(k=>$(k).value=4);$('ac_remotes_std').value=1;['beds_plan','mattresses_plan','closets_plan','ac_units_plan'].forEach(k=>$(k).value=k==='ac_units_plan'?4:6);$('ac_remotes_plan').value=1;await load()}catch(err){$('msg').className='msg err';$('msg').textContent='❌ '+err.message}});load();
</script></body></html>
