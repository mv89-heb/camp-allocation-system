<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול חדרים</title>
<style>
body{margin:0;background:#f4f6fa;color:#172033;font-family:Segoe UI,Tahoma,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:24px;margin:0}.sub{color:#667085;font-size:13px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input{padding:11px;border:1px solid #cfd6df;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#4f46e5;color:#fff}.secondary{background:#fff;border:1px solid #dfe4ea}.msg{margin-top:10px;font-weight:700}.ok{color:#027a48}.err{color:#b42318}.room{padding:11px;border:1px solid #dfe4ea;border-radius:11px;margin-top:8px;background:#fafbfc}.room b{font-size:16px}.room small{display:block;color:#667085;margin-top:4px}.auth{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:16px;margin:12px 0}.auth input{width:100%;padding:11px;border:1px solid #cfd6df;border-radius:10px;font-size:16px;box-sizing:border-box}@media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.app{padding:10px}}
</style></head>
<body><main class="app">
<a href="/" class="btn secondary">← חזרה למערכת</a>
<div id="auth" class="auth" hidden><b>🔐 נדרש מפתח מנהל</b><div style="margin-top:8px;color:#667085;font-size:13px">הזן את אותו ADMIN_TOKEN שבו נכנסת למערכת.</div><input id="token" type="password" autocomplete="current-password" style="margin-top:10px"><button id="login" class="btn primary" style="margin-top:10px">כניסה</button><div id="authMsg" class="msg err"></div></div>
<div id="content">
<div class="card"><h1>➕ הוספת חדר</h1><div class="sub">החדר ייווצר כתקן + מצאי התחלתי 0, ויופיע כ״טרם נבדק״.</div>
<form id="form" class="grid" style="margin-top:14px">
<div class="field full"><label>שם חדר / יחידה</label><input id="apartment" maxlength="120" required placeholder="למשל: ירושלים 213 או קרוון 10"></div>
<div class="field"><label>מיטות — תקן</label><input id="beds_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>מזרנים — תקן</label><input id="mattresses_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>ארונות — תקן</label><input id="closets_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>מזגנים — תקן</label><input id="ac_units_std" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>שלטים — תקן</label><input id="ac_remotes_std" type="number" min="0" max="1000" value="1"></div>
<div class="field"><label>מיטות — תקן מתוכנן</label><input id="beds_plan" type="number" min="0" max="1000" value="6"></div>
<div class="field"><label>מזרנים — תקן מתוכנן</label><input id="mattresses_plan" type="number" min="0" max="1000" value="6"></div>
<div class="field"><label>ארונות — תקן מתוכנן</label><input id="closets_plan" type="number" min="0" max="1000" value="6"></div>
<div class="field"><label>מזגנים — תקן מתוכנן</label><input id="ac_units_plan" type="number" min="0" max="1000" value="4"></div>
<div class="field"><label>שלטים — תקן מתוכנן</label><input id="ac_remotes_plan" type="number" min="0" max="1000" value="1"></div>
<div class="field full"><button class="btn primary" type="submit">💾 צור חדר</button></div>
</form><div id="msg" class="msg"></div></div>
<div class="card"><h2>חדרים שנוספו</h2><div id="rooms">טוען...</div></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);const fields=['beds_std','mattresses_std','closets_std','ac_units_std','ac_remotes_std','beds_plan','mattresses_plan','closets_plan','ac_units_plan','ac_remotes_plan'];
let token=sessionStorage.getItem('camp_admin_token')||'';
function headers(){const h={'Content-Type':'application/json'};if(token)h['X-Admin-Token']=token;return h}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.detail||`HTTP ${r.status}`);e.status=r.status;throw e}return d}
function showAuth(){ $('auth').hidden=false;$('content').hidden=true }
function hideAuth(){ $('auth').hidden=true;$('content').hidden=false }
async function load(){try{const data=await api('/field-api/rooms');$('rooms').innerHTML=data.map(x=>`<div class="room"><b>${esc(x.apartment)}</b><small>${esc(x.group)} · ${x.inventory_checked?'נבדק':'טרם נבדק'} · בפועל: ${x.beds_act}/${x.mattresses_act}/${x.closets_act}/${x.ac_units_act}/${x.ac_remotes_act}</small></div>`).join('')||'אין חדרים';hideAuth()}catch(e){if(e.status===401)showAuth();else $('rooms').textContent=e.message}}
$('login').addEventListener('click',async()=>{token=$('token').value.trim();if(!token){$('authMsg').textContent='יש להזין מפתח';return}sessionStorage.setItem('camp_admin_token',token);await load();if($('auth').hidden===false)$('authMsg').textContent='מפתח אינו תקין'});
$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='שומר...';const body={apartment:$('apartment').value};fields.forEach(k=>body[k]=Math.max(0,Number($(k).value)||0));try{const d=await api('/rooms',{method:'POST',body:JSON.stringify(body)});$('msg').className='msg ok';$('msg').textContent=`✅ החדר ${d.apartment} נוצר בהצלחה`;e.target.reset();['beds_std','mattresses_std','closets_std','ac_units_std'].forEach(k=>$(k).value=4);$('ac_remotes_std').value=1;['beds_plan','mattresses_plan','closets_plan','ac_units_plan'].forEach(k=>$(k).value=k==='ac_units_plan'?4:6);$('ac_remotes_plan').value=1;await load()}catch(err){if(err.status===401){showAuth();$('authMsg').textContent='מפתח אינו תקין'}else{$('msg').className='msg err';$('msg').textContent='❌ '+err.message}}});
load();
</script></body></html>
