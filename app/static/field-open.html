<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דיווח שטח</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f4f6fa;font-family:Segoe UI,Tahoma,Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="field" src="/static/inspection.html"></iframe>
<script>
// Current phase: field authentication is disabled. Automatically open the existing
// mobile field form without requiring a token. The API accepts the request without auth.
const frame=document.getElementById('field');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const token=w.document.getElementById('token');
    const login=w.document.querySelector('#login button');
    if(token) token.value='field-open';
    if(login) login.click();
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
