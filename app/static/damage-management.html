<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>ניהול נזקים | מערכת הקמפוס</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe4ea;--primary:#4f46e5;--ok:#027a48;--okbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--warn:#b54708;--warnbg:#fffaeb;--info:#175cd3;--infobg:#eff8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:25px;font-weight:900}.sub{font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.filters input,.filters select,.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:10px;background:#fff;font:inherit}.queue{display:grid;gap:9px}.damage{border:1px solid #efc3be;background:#fffafa;border-radius:14px;padding:13px}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.room{font-size:17px;font-weight:900}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:850}.danger{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.info{background:var(--infobg);color:var(--info)}.ok{background:var(--okbg);color:var(--ok)}.desc{margin:9px 0;line-height:1.5}.meta{font-size:12px;color:var(--muted)}.edit{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:11px;font-weight:850;margin-bottom:4px}.field textarea{min-height:75px}.full{grid-column:1/-1}.notice{padding:10px;border-radius:10px;background:var(--infobg);color:var(--info);font-size:12px}.error{color:var(--bad);font-weight:800}.success{color:var(--ok);font-weight:800}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:700px){.top{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.edit{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><div class="title">🛠️ ניהול נזקים</div><div class="sub">תור עבודה לנזקים פתוחים, טיפול, תיקון וסגירה</div></div><div class="actions"><a class="btn" href="/static/admin.html" style="text-decoration:none">📊 ניהול</a><a class="btn primary" href="/static/inspection.html" style="text-decoration:none;color:#fff">📱 דיווח</a><button class="btn" onclick="load()">🔄</button></div></header>
<section class="card"><div class="filters"><input id="q" placeholder="חפש חדר או תיאור" oninput="render()"><select id="status" onchange="render()"><option value="OPEN">פתוח</option><option value="INSPECTION">בבדיקה</option><option value="IN_PROGRESS">בטיפול</option><option value="RESOLVED">טופל</option><option value="CLOSED">סגור</option><option value="ALL">הכול</option></select><select id="severity" onchange="render()"><option value="ALL">כל החומרות</option><option value="LOW">נמוכה</option><option value="MEDIUM">בינונית</option><option value="HIGH">גבוהה</option><option value="CRITICAL">קריטית</option></select><select id="category" onchange="render()"><option value="ALL">כל הקטגוריות</option><option value="FURNITURE">ריהוט</option><option value="ELECTRICAL">חשמל</option><option value="PLUMBING">אינסטלציה</option><option value="STRUCTURE">מבנה</option><option value="CLEANLINESS">ניקיון</option><option value="HVAC">מיזוג</option><option value="OTHER">אחר</option></select></div></section>
<section class="card"><div id="summary" class="notice">טוען...</div><div id="queue" class="queue" style="margin-top:10px"></div></section>
</div>
<script>
let all=[];const S={OPEN:'פתוח',INSPECTION:'בבדיקה',IN_PROGRESS:'בטיפול',RESOLVED:'טופל',CLOSED:'סגור'},V={LOW:'נמוכה',MEDIUM:'בינונית',HIGH:'גבוהה',CRITICAL:'קריטית'},C={FURNITURE:'ריהוט',ELECTRICAL:'חשמל',PLUMBING:'אינסטלציה',STRUCTURE:'מבנה',CLEANLINESS:'ניקיון',HVAC:'מיזוג',OTHER:'אחר'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),s=document.getElementById('status').value,v=document.getElementById('severity').value,c=document.getElementById('category').value;const list=all.filter(d=>(!q||`${d.apartment} ${d.description||''}`.toLowerCase().includes(q))&&(s==='ALL'||d.status===s)&&(v==='ALL'||d.severity===v)&&(c==='ALL'||d.category===c));document.getElementById('summary').textContent=`מוצגים ${list.length} דיווחים מתוך ${all.length}`;document.getElementById('queue').innerHTML=list.length?list.map(d=>card(d)).join(''):'<div class="empty">אין דיווחים לפי הסינון.</div>'}
function card(d){return `<article class="damage"><div class="head"><div><div class="room">${esc(d.apartment)}</div><div class="meta">דיווח #${d.id} · ${esc(d.reported_by||'')}</div></div><div class="badges"><span class="badge danger">${esc(V[d.severity]||d.severity)}</span><span class="badge info">${esc(S[d.status]||d.status)}</span><span class="badge warn">${esc(C[d.category]||d.category)}</span></div></div><div class="desc">${esc(d.description||'ללא תיאור')}</div><div class="meta">נפתח: ${esc(new Date(d.reported_at).toLocaleString('he-IL'))}${d.updated_at?' · עודכן: '+esc(new Date(d.updated_at).toLocaleString('he-IL')):''}</div><div class="edit"><div class="field"><label>סטטוס</label><select id="s-${d.id}">${Object.entries(S).map(([k,x])=>`<option value="${k}" ${k===d.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>עלות בפועל</label><input id="cost-${d.id}" type="number" min="0" step="0.01" value="${d.actual_cost??''}"></div><div class="field full"><label>הערת טיפול</label><textarea id="note-${d.id}">${esc(d.resolution_notes||'')}</textarea></div><div class="full"><button class="btn primary" onclick="save(${d.id})">💾 שמור שינוי</button></div></div></article>`}
async function save(id){try{const status=document.getElementById('s-'+id).value,actual_cost=document.getElementById('cost-'+id).value===''?null:Number(document.getElementById('cost-'+id).value),resolution_notes=document.getElementById('note-'+id).value;await api('/damages/'+id,{method:'PATCH',body:JSON.stringify({status,actual_cost,resolution_notes})});await load()}catch(e){alert('לא ניתן לשמור: '+e.message)}}
async function load(){try{all=await api('/damages');render()}catch(e){document.getElementById('summary').className='notice error';document.getElementById('summary').textContent='שגיאה בטעינת הנזקים: '+e.message}}load();
</script></body></html>
