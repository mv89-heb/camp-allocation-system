<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>ניהול ובקרה | מערכת הקמפוס</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe4ea;--primary:#4f46e5;--ok:#027a48;--okbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--warn:#b54708;--warnbg:#fffaeb;--info:#175cd3;--infobg:#eff8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:14px 14px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.title{font-size:26px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.filters{display:grid;grid-template-columns:1fr 180px 180px;gap:9px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:10px;background:#fff}.section-title{font-size:17px;font-weight:900;margin-bottom:10px}.floor{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}.floorhead{padding:11px 13px;background:#f8fafc;display:flex;justify-content:space-between;font-weight:900}.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px}.room{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.room b{display:block;font-size:16px}.room .meta{font-size:11px;color:var(--muted);margin-top:4px}.room.ok{background:var(--okbg);border-color:#b7e4ca}.room.bad{background:var(--badbg);border-color:#f0c0bc}.room.warn{background:var(--warnbg);border-color:#f3d29b}.room button{margin-top:8px;width:100%;padding:8px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}.badge{padding:4px 8px;border-radius:999px;font-weight:800;font-size:11px}.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.damage{border:1px solid #f0c0bc;background:#fff8f7;border-radius:13px;padding:11px;margin-top:8px}.damage strong{color:var(--bad)}.empty{text-align:center;padding:30px;color:var(--muted)}.modal{position:fixed;inset:0;background:#10182899;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modalbox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f2f4f7;border-radius:9px;padding:8px}.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.num{background:#f8fafc;border-radius:9px;text-align:center;padding:7px}.num small{display:block;color:var(--muted);font-size:10px}.num b{font-size:18px}.red{color:var(--bad)}.green{color:var(--ok)}.orange{color:var(--warn)}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}.rooms{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
@media(max-width:520px){.wrap{padding:10px}.top{align-items:stretch}.title{font-size:21px}.actions{flex-direction:column}.actions .btn{padding:9px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:11px}.rooms{grid-template-columns:1fr 1fr}.room{padding:9px}.modal{padding:0}.modalbox{border-radius:18px 18px 0 0;max-height:94vh}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="title">📊 ניהול ובקרה</div><div class="sub">תמונת מצב של המצאי והנזקים — בלי טבלה עמוסה</div></div><div class="actions"><a class="btn primary" href="/static/inspection.html" style="text-decoration:none;color:white">📱 דיווח מהשטח</a><button class="btn" onclick="load()">🔄 רענן</button></div></header>
<section class="grid" id="stats"></section>
<section class="card"><div class="section-title">🧭 חיפוש וסינון</div><div class="filters"><input id="q" placeholder="חפש חדר, למשל ירושלים 201" oninput="renderRooms()"><select id="status" onchange="renderRooms()"><option value="all">כל החדרים</option><option value="unchecked">טרם נבדקו</option><option value="gap">יש פער</option><option value="ok">ללא פער</option></select><select id="area" onchange="renderRooms()"><option value="all">כל האזורים</option><option value="floor1">קומה 1</option><option value="floor2">קומה 2</option><option value="floor3">קומה 3</option><option value="caravans">מתחם קרוואנים</option><option value="other">יחידות נוספות</option></select></div><div class="legend"><span>🟢 נבדק וללא פער</span><span>🟠 נבדק ויש עודף</span><span>🔴 יש חוסר</span><span>⚪ טרם נבדק</span></div></section>
<section class="card"><div class="section-title">🏠 חדרים לפי מתחם</div><div id="rooms"></div></section>
<section class="card"><div class="section-title">🛠️ נזקים פתוחים</div><div id="damages"></div></section>
</div>
<div id="modal" class="hidden"></div>
<script>
let rooms=[],damages=[];
const groups=[['floor1','🏢 קומה 1','101–108'],['floor2','🏢 קומה 2','201–212'],['floor3','🏢 קומה 3','301–313'],['caravans','🏕️ מתחם קרוואנים','כל הקרוואנים'],['other','📦 יחידות נוספות','']];
const items=[['beds','🛏️','מיטות'],['mattresses','🛏️','מזרנים'],['closets','🚪','ארונות'],['ac_units','❄️','מזגנים'],['ac_remotes','🎛️','שלטים']];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}
function num(n){const m=String(n||'').match(/(\d{3})$/);return m?+m[1]:null}
function group(n){const x=num(n);if(x>=101&&x<=108)return'floor1';if(x>=201&&x<=212)return'floor2';if(x>=301&&x<=313)return'floor3';if(/^קרוון(?:\s|$)/.test(n))return'caravans';return'other'}
function checked(r){return !!r.inventory_checked}
function hasGap(r){return items.some(([k])=>Number(r[k+'_act']??0)!==Number(r[k+'_req']??0))}
function roomClass(r){if(!checked(r))return'';if(hasGap(r))return hasShortage(r)?'bad':'warn';return'ok'}
function hasShortage(r){return items.some(([k])=>Number(r[k+'_act']??0)<Number(r[k+'_req']??0))}
function renderStats(){const total=rooms.length, done=rooms.filter(checked).length, gaps=rooms.filter(hasGap).length, shortages=rooms.filter(r=>checked(r)&&hasShortage(r)).length, open=damages.filter(d=>!['RESOLVED','CLOSED'].includes(d.status)).length;document.getElementById('stats').innerHTML=[['סה״כ חדרים',total,''],['נבדקו',done,''],['טרם נבדקו',total-done,''],['עם פער',gaps,''],['עם חוסר',shortages,''],['נזקים פתוחים',open,'']].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
function renderRooms(){const q=document.getElementById('q').value.trim().toLowerCase(),s=document.getElementById('status').value,a=document.getElementById('area').value;let list=rooms.filter(r=>(!q||String(r.apartment).toLowerCase().includes(q))&& (a==='all'||group(r.apartment)===a) && (s==='all'||(s==='unchecked'&&!checked(r))||(s==='gap'&&checked(r)&&hasGap(r))||(s==='ok'&&checked(r)&&!hasGap(r))));document.getElementById('rooms').innerHTML=groups.map(g=>{const arr=list.filter(r=>group(r.apartment)===g[0]);if(!arr.length)return'';arr.sort((x,y)=>(num(x.apartment)||9999)-(num(y.apartment)||9999));return`<div class="floor"><div class="floorhead"><span>${g[1]}</span><span>${g[2]} · ${arr.length}</span></div><div class="rooms">${arr.map(r=>{const shortage=hasShortage(r);const gap=hasGap(r);const label=!checked(r)?'⚪ טרם נבדק':shortage?'🔴 יש חוסר':gap?'🟠 יש פער':'🟢 תקין';return`<div class="room ${roomClass(r)}"><b>${esc(r.apartment)}</b><div class="meta">${label}</div><button onclick="openRoom('${esc(r.apartment)}')">צפה בנתונים</button></div>`}).join('')}</div></div>`}).join('')||'<div class="empty">לא נמצאו חדרים לפי הסינון.</div>'}
function renderDamages(){const open=damages.filter(d=>!['RESOLVED','CLOSED'].includes(d.status));document.getElementById('damages').innerHTML=open.length?open.map(d=>`<div class="damage"><strong>${esc(d.apartment)}</strong> · ${esc(d.description||'ללא תיאור')}<div style="margin-top:6px"><span class="badge b-bad">${esc(d.severity)}</span> <span class="badge b-info">${esc(d.status)}</span> <span class="badge b-warn">${esc(d.category)}</span></div></div>`).join(''):'<div class="empty">🎉 אין נזקים פתוחים.</div>'}
function openRoom(name){const r=rooms.find(x=>x.apartment===name);if(!r)return;document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><div><b style="font-size:22px">${esc(r.apartment)}</b><div class="sub">${checked(r)?'בדיקה בוצעה':'טרם בוצעה בדיקה'}</div></div><button class="close" onclick="closeModal()">✕</button></div>${items.map(([k,icon,label])=>{const req=Number(r[k+'_req']??0),act=Number(r[k+'_act']??0),gap=act-req;return`<div class="item"><b>${icon} ${label}</b><div class="nums"><div class="num"><small>צריך להיות</small><b>${req}</b></div><div class="num"><small>קיים בפועל</small><b>${act}</b></div><div class="num"><small>פער</small><b class="${gap<0?'red':gap>0?'orange':'green'}">${gap>0?'+':''}${gap}</b></div></div></div>`}).join('')}<div style="margin-top:12px"><a class="btn primary" style="display:block;text-align:center;text-decoration:none" href="/static/inspection.html?room=${encodeURIComponent(r.apartment)}">פתח לדיווח בחדר הזה</a></div></div>`}
function closeModal(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}
async function load(){try{const [r,d]=await Promise.all([api('/analyze?mode=std'),api('/damages')]);rooms=r;damages=d;renderStats();renderRooms();renderDamages()}catch(e){document.getElementById('rooms').innerHTML='<div class="empty" style="color:#b42318">שגיאה בטעינת הנתונים: '+esc(e.message)+'</div>'}}
load();
</script>
</body></html>
