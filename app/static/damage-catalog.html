<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דיווח תקלה מובנה</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#d9dee7;--p:#4f46e5;--ok:#027a48;--bad:#b42318;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 30px}.top{position:sticky;top:0;background:#f4f6faf5;padding-bottom:10px;z-index:2}.title{font-size:25px;font-weight:950}.muted{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:12px}.field{margin-top:11px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:11px;background:#fff;font:inherit}.field textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{width:100%;margin-top:14px;border:0;border-radius:11px;background:var(--p);color:#fff;padding:13px;font-weight:900;font-size:16px}.wa{width:100%;margin-top:9px;border:0;border-radius:11px;background:#0a8f4d;color:#fff;padding:13px;font-weight:900;font-size:16px}.back{display:inline-block;text-decoration:none;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:850}.msg{margin-top:10px;font-weight:850}.ok{color:var(--ok)}.err{color:var(--bad)}.preview{background:#fafbff;border:1px dashed #bfc8ff;border-radius:11px;padding:11px;margin-top:11px;white-space:pre-wrap;line-height:1.55}.small{font-size:11px;color:var(--muted)}@media(max-width:500px){.grid{grid-template-columns:1fr}.app{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="back" href="/static/field-report.html">← חזרה לדיווח השטח</a><div class="title" style="margin-top:10px">🛠️ דיווח תקלה מובנה</div><div class="muted">בחר קטגוריה → תת־קטגוריה → פריט. אין צורך לנסח את סוג התקלה מאפס.</div></header>
<section class="card">
<div class="grid">
<div class="field"><label>חדר</label><input id="room" placeholder="למשל: ירושלים 201"></div>
<div class="field"><label>שם המדווח</label><input id="reporter" maxlength="120"></div>
</div>
<div class="field"><label>קטגוריה</label><select id="category"></select></div>
<div class="field"><label>תת־קטגוריה</label><select id="subcategory"></select></div>
<div class="field"><label>פריט / רכיב</label><select id="item"></select></div>
<div class="field"><label>חומרה</label><select id="severity"><option value="LOW">נמוכה</option><option value="MEDIUM" selected>בינונית</option><option value="HIGH">גבוהה</option><option value="CRITICAL">קריטית</option></select></div>
<div class="field"><label>מה הבעיה?</label><textarea id="description" placeholder="לדוגמה: לא נסגר / יצא מהמקום / מהבהב / חסר"></textarea></div>
<div class="preview" id="preview"></div>
<button class="primary" onclick="save()">💾 שמור דיווח</button>
<button class="wa" onclick="whatsapp()">📱 פתח WhatsApp עם הדיווח</button>
<div id="msg" class="msg"></div>
</section>
</div>
<script>
const C={
FURNITURE:{label:'ריהוט ופרזול',s:{CABINETS:['ארונות',['ארון ראשי','ארון ימני','ארון שמאלי','ארון פנימי','ארון כניסה','ארון משני / ספייר']],DRAWERS:['מגירות',['מגירה תחתונה','מגירה תחתונה ימנית','מגירה תחתונה שמאלית','מגירה חסרה']],DOORS:['דלתות / ידיות / צירים',['דלת ימין','דלת שמאל','דלת ארון','ידית ארון','ציר דלת / ארון']],SHELVES:['מדפים',['מדף','מדף עליון','מדף באזור הדוש']],SHUTTERS:['תריסים / פתחי אוורור',['תריס','מנגנון תריס','חוט / רצועת גלילת תריס','פתח אוורור']],STABILITY:['יציבות וחיזוק',['ארון מתנדנד','חיזוק מבני']],OTHER:['אחר בריהוט',[]]}},
ELECTRICAL:{label:'חשמל ותאורה',s:{BULBS:['נורות',['נורה לא נדלקת','נורה מהבהבת','נורה בעוצמה נמוכה','נורה תקולה']],FIXTURES:['בתי נורה / גופי תאורה',['בית נורה','גוף תאורה']],OUTLETS:['שקעים חשמליים',['שקע חשמלי פתוח','שקע חשמלי חשוף','שקע חשמלי לא בטיחותי']],OTHER:['אחר בחשמל',[]]}},
PLUMBING:{label:'אינסטלציה',s:{FAUCETS:['ברזים',['ברז','ברז ימני','ברז שלישי משמאל','ברז קיצוני שמאלי']],WATER_FLOW:['לחץ / ספיקת מים',['ספיקת מים חמים נמוכה','לחץ מים חלש','ספיקת מים נמוכה']],SHOWER:['מקלחת / דוש',['ראש מקלחת / דוש חסר','ראש מקלחת']],TOILET:['אסלה והדחה',['לחץ מים באסלה','מנגנון הדחה','אסלה']],OTHER:['אחר באינסטלציה',[]]}},
HVAC:{label:'מיזוג אוויר',s:{CENTRAL:['מיזוג מרכזי / קופסת בקרה',['קופסת בקרה לשלט המרכזי','קופסת בקרה משוחררת','שלט מרכזי']],INDIVIDUAL:['מזגן נפרד',['יחידת מזגן','שלט מזגן']],OTHER:['אחר במיזוג',[]]}},
CLEANLINESS:{label:'ניקיון וגימור',s:{CLEANING:['ניקיון',['ניקוי קיר','ניקיון ייעודי','לכלוך']],PAINT:['צבע וגימור',['תיקון צבע','תיקון גימור','צבע סביב בית נורה']],OTHER:['אחר בניקיון וגימור',[]]}},
SAFETY:{label:'בטיחות והיערכות לשריפות',s:{EMERGENCY_EXIT:['יציאת חירום',['מיקום מיטה ליד יציאת חירום','גישה ליציאת חירום']],ELECTRICAL:['בטיחות חשמלית',['שקע חשמלי חשוף','שקע חשמלי פתוח']],OTHER:['אחר בבטיחות',[]]}},
STRUCTURE:{label:'מבנה ותחזוקה',s:{STRUCTURAL:['ליקוי מבני',['חיזוק מבני','חלק שבור','חלק מפורק']],OTHER:['אחר במבנה',[]]}},
OTHER:{label:'אחר',s:{GENERAL:['כללי',['אחר']]}}
};
const el=id=>document.getElementById(id);function init(){el('category').innerHTML=Object.entries(C).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');el('category').onchange=loadSubs;el('subcategory').onchange=loadItems;['room','reporter','severity','description'].forEach(id=>el(id).addEventListener('input',preview));loadSubs();}function loadSubs(){const c=C[el('category').value];el('subcategory').innerHTML=Object.entries(c.s).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');loadItems();}function loadItems(){const c=C[el('category').value],s=c.s[el('subcategory').value];el('item').innerHTML=(s[1].length?s[1]:['אחר']).map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');preview();}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function payload(){const cat=el('category').value,sub=el('subcategory').value,item=el('item').value,desc=el('description').value.trim();const text=`${C[cat].label} → ${C[cat].s[sub][0]} → ${item}${desc?' — '+desc:''}`;return {apartment:el('room').value.trim(),reporter_name:el('reporter').value.trim(),category:cat,subcategory:sub,item_name:item,severity:el('severity').value,description:text};}
function preview(){const p=payload();el('preview').textContent=`📍 ${p.apartment||'—'}\n🛠️ ${p.category}\n${C[p.category].label} → ${C[p.category].s[p.subcategory].join(' → ')}\n⚠️ ${p.severity}\n📝 ${p.description||'תיאור נוסף לא הוזן'}\n👤 ${p.reporter_name||'—'}`}
async function save(){const p=payload();if(!p.apartment||p.description.length<5){el('msg').className='msg err';el('msg').textContent='יש לבחור חדר ולהוסיף תיאור קצר של הבעיה';return}try{const r=await fetch('/damages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'השמירה נכשלה');el('msg').className='msg ok';el('msg').textContent='הדיווח נשמר במערכת ✓'}catch(e){el('msg').className='msg err';el('msg').textContent=e.message}}
function whatsapp(){const p=payload();const phone=localStorage.getItem('camp_whatsapp_phone')||prompt('מספר WhatsApp בפורמט בינלאומי (למשל 9725XXXXXXXX):','');if(!phone)return;localStorage.setItem('camp_whatsapp_phone',phone.replace(/\D/g,''));const msg=`🚨 דיווח תקלה\n\n📍 חדר: ${p.apartment}\n🛠️ תחום: ${C[p.category].label}\n📂 תת־קטגוריה: ${C[p.category].s[p.subcategory][0]}\n🔧 פריט: ${p.item_name}\n⚠️ דחיפות: ${p.severity}\n📝 ${p.description}\n👤 ${p.reporter_name||'—'}`;window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank','noopener,noreferrer')}
init();
</script></body></html>
